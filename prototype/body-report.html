  var app = $('#app');
  var phone = $('#phone');
  var device = $('#device');
  var stage = $('#stage');
  var sheet = $('#sheet');
  var sheetHead = $('#sheetHead');
  var sheetBody = $('#sheetBody');
  var scrim = $('#scrim');
  var timelineEl = $('#timeline');
  var datePrev = $('#datePrev');
  var dateNext = $('#dateNext');
  var dateCurrent = $('#dateCurrent');
  var memberFilterEl = $('#memberFilter');
  var grid = $('#metricGrid');
  var trendPanel = $('#trendPanel');
  var trendChartWrap = $('#trendChartWrap');
  var chartSvg = $('#trendChart');
  var chartNote = $('#chartSingleNote');
  var dial = $('#dial');
  var ringProgress = $('#ringProgress');
  var weightValue = $('#weightValue');
  var weightDelta = $('#weightDelta');
  var statusText = $('#statusText');
  var statusDot = $('#statusDot');
  var dialCaption = $('#dialCaption');
  var primaryAction = $('#primaryAction');
  var actionLabel = $('#actionLabel');
  var insightDelta = $('#insightDelta');
  var insightDeltaLabel = $('#insightDeltaLabel');
  var insightCount = $('#insightCount');
  var stageAvatar = $('#stageAvatar');
  var stageMemberName = $('#stageMemberName');
  var sheetDate = $('#sheetDate');
  var sheetMember = $('#sheetMember');
  var sheetBadge = $('#sheetBadge');
  var recordCount = $('#recordCount');
  var segThumb = $('#segThumb');
  var sheetToggle = $('#sheetToggle');
  var trendTitle = $('#trendTitle');
  var trendSub = $('#trendSub');
  var trendValue = $('#trendValue');
  var trendUnit = $('#trendUnit');
  var trendDelta = $('#trendDelta');
  var toast = $('#toast');
  var demoPanel = $('#demoPanel');
  var demoFab = $('#demoFab');
  var todayLabel = $('#todayLabel');
  var syncLabel = $('#syncLabel');

  var cardEls = {};
  $$('.metric-card').forEach(function (card) {
    cardEls[card.getAttribute('data-metric')] = card;
    var head = card.querySelector('.card-head');
    if (head) head.setAttribute('data-icon', card.getAttribute('data-icon') || '');
  });

  var state = {
    demo: 'normal',
    theme: 'light',
    mode: 'single',
    weekStartMs: Date.now(),
    memberFilter: 'm1',
    members: MEMBERS.slice(),
    records: [],
    snapshots: [],
    selectedIndex: 0,
    selectedMetric: 'weight',
    phase: 'complete',
    offline: false,
    isFirst: false,
    sheetAnchor: 'collapsed',
    sheetTarget: 'collapsed',
    sheetOffset: 0,
    sheetState: 'collapsed',
    dragging: false,
    springing: false,
    seqRunning: false,
    dragStartY: 0,
    dragStartOffset: 0,
    dragMoved: 0,
    dragSamples: [],
    releaseVelocity: 0,
    chartPoints: [],
    chartW: 0
  };

  var seqTimers = [];
  var springRaf = 0;
  var scrambleTimer = 0;
  var revealTimer = 0;
  var toastTimer = 0;

  /* ---------------- 数据 ---------------- */

  function memberOf(id) {
    for (var i = 0; i < MEMBERS.length; i++) {
      if (MEMBERS[i].id === id) return MEMBERS[i];
    }
    return null;
  }

  function bmiOf(weight, member) {
    if (weight == null || !member) return null;
    var m = member.heightCm / 100;
    return weight / (m * m);
  }

  function recordsFor(member, base) {
    var data = SERIES[member.id];
    var out = [];
    for (var i = 0; i < DAY_OFFSETS.length; i++) {
      var bone = Array.isArray(data.bone) ? data.bone[i] : data.bone;
      out.push({
        id: member.id + '-' + i,
        memberId: member.id,
        measuredAt: base - DAY_OFFSETS[i] * DAY,
        weight: data.weights[i],
        bodyFat: data.bodyFat[i],
        muscle: data.muscle[i],
        water: data.water[i],
        visceral: data.visceral[i],
        protein: data.protein[i],
        bone: bone,
        hasBia: true
      });
    }
    return out;
  }

  function buildDemoRecords(demo) {
    var latestBase = Date.now() - 37 * 60000;
    var base = demo === 'offline' ? latestBase - 28 * 3600000 : latestBase;
    var members = demo === 'first' ? [MEMBERS[0]] : MEMBERS;
    var list = [];
    members.forEach(function (member) {
      list = list.concat(recordsFor(member, base));
    });
    list.sort(function (a, b) { return b.measuredAt - a.measuredAt; });

    if (demo === 'first') {
      list = list.filter(function (r) { return r.memberId === 'm1'; }).slice(0, 1);
    }
    if (demo === 'nobia') {
      var latest = null;
      for (var i = 0; i < list.length; i++) {
        if (list[i].memberId === 'm1') { latest = list[i]; break; }
      }
      if (latest) {
        latest.hasBia = false;
        latest.bodyFat = null;
        latest.muscle = null;
        latest.water = null;
        latest.visceral = null;
        latest.protein = null;
        latest.bone = null;
      }
    }
    return list;
  }

  function weekStart(ts) {
    var d = new Date(ts);
    d.setHours(0, 0, 0, 0);
    var day = (d.getDay() + 6) % 7;
    d.setDate(d.getDate() - day);
    return d.getTime();
  }

  function formatWeekRange(startMs) {
    var start = new Date(startMs);
    var end = new Date(startMs + 6 * DAY);
    return pad2(start.getMonth() + 1) + '/' + pad2(start.getDate()) +
      ' – ' + pad2(end.getMonth() + 1) + '/' + pad2(end.getDate());
  }

  function monthStart(ts) {
    var d = new Date(ts);
    return new Date(d.getFullYear(), d.getMonth(), 1).getTime();
  }

  function average(values) {
    var arr = values.filter(function (v) {
      return typeof v === 'number' && isFinite(v) && v > 0;
    });
    if (!arr.length) return null;
    var sum = 0;
    for (var i = 0; i < arr.length; i++) sum += arr[i];
    return sum / arr.length;
  }

  function singleSnapshot(r) {
    var member = memberOf(r.memberId);
    var d = new Date(r.measuredAt);
    var dateLine = dayPrefix(r.measuredAt) + ' ' + formatHM(r.measuredAt);
    return {
      id: r.id,
      mode: 'single',
      memberId: r.memberId,
      member: member,
      bucketStart: r.measuredAt,
      measuredAt: r.measuredAt,
      label: pad2(d.getMonth() + 1) + '/' + pad2(d.getDate()),
      sublabel: formatHM(r.measuredAt),
      dateLine: dateLine,
      sampleCount: 1,
      weight: r.weight,
      bmi: bmiOf(r.weight, member),
      bodyFat: r.bodyFat,
      muscle: r.muscle,
      water: r.water,
      visceral: r.visceral,
      protein: r.protein,
      bone: r.bone,
      hasBia: r.hasBia
    };
  }

  function aggregateSnapshot(records, bucketStart, mode, filterId) {
    var sorted = records.slice().sort(function (a, b) { return b.measuredAt - a.measuredAt; });
    var latest = sorted[0];
    var memberId = filterId || null;
    var member = memberId ? memberOf(memberId) : null;
    var bodyFat = average(sorted.map(function (r) { return r.bodyFat; }));
    var muscle = average(sorted.map(function (r) { return r.muscle; }));
    var water = average(sorted.map(function (r) { return r.water; }));
    var visceral = average(sorted.map(function (r) { return r.visceral; }));
    var protein = average(sorted.map(function (r) { return r.protein; }));
    var bone = average(sorted.map(function (r) { return r.bone; }));
    var weight = average(sorted.map(function (r) { return r.weight; }));
    var bmi = average(sorted.map(function (r) { return bmiOf(r.weight, memberOf(r.memberId)); }));
    var hasBia = bodyFat != null || muscle != null || water != null ||
      visceral != null || protein != null || bone != null;
    var b = new Date(bucketStart);
    var label;
    var sublabel;
    var dateLine;
    if (mode === 'week') {
      label = pad2(b.getMonth() + 1) + '/' + pad2(b.getDate());
      sublabel = '周均';
      var end = new Date(bucketStart + 6 * DAY);
      dateLine = label + '–' + pad2(end.getMonth() + 1) + '/' + pad2(end.getDate()) + ' 周均';
    } else {
      label = (b.getMonth() + 1) + '月';
      sublabel = '月均';
      dateLine = b.getFullYear() + '年' + (b.getMonth() + 1) + '月 · 月均';
    }
    return {
      id: mode + '-' + bucketStart,
      mode: mode,
      memberId: memberId,
      member: member,
      bucketStart: bucketStart,
      measuredAt: latest.measuredAt,
      label: label,
      sublabel: sublabel,
      dateLine: dateLine,
      sampleCount: records.length,
      weight: weight,
      bmi: bmi,
      bodyFat: bodyFat,
      muscle: muscle,
      water: water,
      visceral: visceral,
      protein: protein,
      bone: bone,
      hasBia: hasBia
    };
  }

  function buildSnapshots(mode, filterId) {
    var weekEnd = state.weekStartMs + 7 * DAY;
    var recs = state.records.filter(function (r) {
      return (!filterId || r.memberId === filterId) &&
        r.measuredAt >= state.weekStartMs && r.measuredAt < weekEnd;
    });
    if (mode === 'single') {
      return recs.map(singleSnapshot).sort(function (a, b) { return b.measuredAt - a.measuredAt; });
    }
    var groups = {};
    recs.forEach(function (r) {
      var key = mode === 'week' ? weekStart(r.measuredAt) : monthStart(r.measuredAt);
      if (!groups[key]) groups[key] = [];
      groups[key].push(r);
    });
    var list = [];
    Object.keys(groups).forEach(function (key) {
      list.push(aggregateSnapshot(groups[key], Number(key), mode, filterId));
    });
    list.sort(function (a, b) { return b.bucketStart - a.bucketStart; });
    return list;
  }

  /* ---------------- 指标/阈值 ---------------- */

  function femaleOf(snapshot) {
    var member = snapshot.member || memberOf(snapshot.memberId) || state.members[0];
    return member && member.sex === 'female';
  }

  function boneTarget(weight, female) {
    if (female) {
      if (!weight) return 2.2;
      return weight < 45 ? 1.8 : (weight <= 60 ? 2.2 : 2.5);
    }
    if (!weight) return 2.9;
    return weight < 60 ? 2.5 : (weight <= 75 ? 2.9 : 3.2);
  }

  function rangeSpec(key, snapshot) {
    var female = femaleOf(snapshot);
    var weight = snapshot.weight;
    if (key === 'bmi') {
      return { min: 14, stdStart: 18.5, stdEnd: 23.9, max: 32 };
    }
    if (key === 'bodyFat') {
      return { min: 5, stdStart: female ? 18 : 10, stdEnd: female ? 28 : 20, max: 40 };
    }
    if (key === 'muscle') {
      if (!weight) return null;
      return {
        min: 0,
        stdStart: weight * (female ? 0.35 : 0.40),
        stdEnd: weight * (female ? 0.55 : 0.60),
        max: weight * 0.65
      };
    }
    if (key === 'water') {
      return { min: 30, stdStart: female ? 45 : 55, stdEnd: female ? 60 : 65, max: 75 };
    }
    if (key === 'visceral') {
      return { min: 1, stdStart: 1, stdEnd: 9, max: 20 };
    }
    if (key === 'protein') {
      return { min: 10, stdStart: 16, stdEnd: 20, max: 24 };
    }
    if (key === 'bone') {
      var target = boneTarget(weight, female);
      return { min: 1, stdStart: target - 0.3, stdEnd: target + 0.3, max: 5 };
    }
    return null;
  }

  function statusFor(key, value, snapshot) {
    if (value == null) return { tone: 'neutral', label: '无数据' };
    var female = femaleOf(snapshot);
    var weight = snapshot.weight || 0;
    if (key === 'bmi') {
      if (value < 18.5) return { tone: 'warn', label: '偏瘦' };
      if (value < 24) return { tone: 'good', label: '标准' };
      if (value < 28) return { tone: 'warn', label: '偏胖' };
      return { tone: 'danger', label: '肥胖' };
    }
    if (key === 'bodyFat') {
      var loF = female ? 18 : 10;
      var hiF = female ? 28 : 20;
      if (value < loF) return { tone: 'warn', label: '偏低' };
      if (value <= hiF) return { tone: 'good', label: '标准' };
      if (value <= hiF + 5) return { tone: 'warn', label: '偏高' };
      return { tone: 'danger', label: '肥胖' };
    }
    if (key === 'muscle') {
      var loM = weight * (female ? 0.35 : 0.40);
      var hiM = weight * (female ? 0.55 : 0.60);
      if (value < loM) return { tone: 'warn', label: '偏低' };
      if (value <= hiM) return { tone: 'good', label: '达标' };
      return { tone: 'warn', label: '偏高' };
    }
    if (key === 'water') {
      var loW = female ? 45 : 55;
      var hiW = female ? 60 : 65;
      if (value < loW) return { tone: 'warn', label: '偏低' };
      if (value <= hiW) return { tone: 'good', label: '达标' };
      return { tone: 'warn', label: '偏高' };
    }
    if (key === 'visceral') {
      if (value <= 9) return { tone: 'good', label: '达标' };
      if (value <= 14) return { tone: 'warn', label: '偏高' };
      return { tone: 'danger', label: '超标' };
    }
    if (key === 'protein') {
      if (value < 16) return { tone: 'warn', label: '偏低' };
      if (value <= 20) return { tone: 'good', label: '达标' };
      return { tone: 'warn', label: '偏高' };
    }
    if (key === 'bone') {
      var target = boneTarget(weight, female);
      if (Math.abs(value - target) <= 0.3) return { tone: 'good', label: '正常' };
      return { tone: 'warn', label: value < target ? '偏低' : '偏高' };
    }
    return { tone: 'neutral', label: '' };
  }

  function footText(key, value, snapshot) {
    var spec = rangeSpec(key, snapshot);
    if (!spec) return '';
    if (key === 'bodyFat') return '标准 ' + spec.stdStart + '–' + spec.stdEnd + '%';
    if (key === 'muscle') return '标准 ' + spec.stdStart.toFixed(1) + '–' + spec.stdEnd.toFixed(1) + ' kg';
    if (key === 'water') return '标准 ' + spec.stdStart + '–' + spec.stdEnd + '%';
    if (key === 'visceral') return '标准 ' + spec.stdStart + '–' + spec.stdEnd + ' 级';
    if (key === 'protein') return '标准 ' + spec.stdStart + '–' + spec.stdEnd + '%';
    if (key === 'bone') return '目标 ' + ((spec.stdStart + spec.stdEnd) / 2).toFixed(1) + ' ± 0.3 kg';
    return '';
  }

  function metricValue(snapshot, key) {
    if (!snapshot) return null;
    if (key === 'bmi') return snapshot.bmi;
    var v = snapshot[key];
    return typeof v === 'number' && isFinite(v) ? v : null;
  }

  function formatValue(key, value) {
    if (value == null) return '--';
    return Number(value).toFixed(METRICS[key].decimals);
  }

  function currentSnapshot() {
    return state.snapshots[state.selectedIndex] || null;
  }

  function deltaFor(snapshot) {
    var older = state.snapshots[state.selectedIndex + 1];
    if (!snapshot || !older) return null;
    if (snapshot.weight == null || older.weight == null) return null;
    return snapshot.weight - older.weight;
  }

  /* ---------------- 渲染：抽屉信息/时间轴 ---------------- */

  function formatHM(ts) {
    var d = new Date(ts);
    return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }

  function dayPrefix(ts) {
    var d = new Date(ts);
    var now = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
    var that = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
    var diff = Math.round((today - that) / DAY);
    if (diff === 0) return '今天';
    if (diff === 1) return '昨天';
    return (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }

  function formatToday() {
    var d = new Date();
    return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + WEEKDAYS[d.getDay()];
  }

  function renderSheetMeta(snapshot) {
    if (!snapshot) return;
    if (snapshot.mode === 'single') {
      sheetDate.textContent = dayPrefix(snapshot.measuredAt) + ' ' + formatHM(snapshot.measuredAt);
    } else {
      sheetDate.textContent = snapshot.dateLine;
    }
    var member = snapshot.member || memberOf(snapshot.memberId);
    sheetMember.textContent = member
      ? member.name + ' · ' + member.sexLabel + ' ' + member.age + '岁'
      : '全部成员 · 合并趋势';
    var badgeText = '';
    var badgeClass = 'sheet-badge';
    if (state.demo === 'offline') {
      badgeText = '离线';
      badgeClass += ' is-muted';
    } else if (!snapshot.hasBia) {
      badgeText = '2 项';
      badgeClass += ' is-warn';
    } else if (state.isFirst) {
      badgeText = '基准';
    } else {
      badgeText = '8 项';
    }
    sheetBadge.className = badgeClass;
    sheetBadge.textContent = badgeText;

    var n = state.snapshots.length;
    if (state.mode === 'single') recordCount.textContent = n + ' 次记录';
    else if (state.mode === 'week') recordCount.textContent = n + ' 周';
    else recordCount.textContent = n + ' 个月';
  }

  function renderTimeline() {
    var html = '';
    for (var i = 0; i < state.snapshots.length; i++) {
      var s = state.snapshots[i];
      var active = i === state.selectedIndex;
      html += '<button class="tl-chip' + (active ? ' active' : '') + '" type="button" role="option" aria-selected="' +
        (active ? 'true' : 'false') + '" data-index="' + i + '" title="' + s.dateLine + ' · ' + s.sampleCount + ' 次">' +
        '<span class="tl-date">' + s.label + '</span>' +
        '<span class="tl-sub">' + s.sublabel + '</span>' +
        '</button>';
    }
    timelineEl.innerHTML = html;
    dateCurrent.textContent = formatWeekRange(state.weekStartMs);
    var hasOlder = state.records.some(function (r) {
      return (!state.memberFilter || r.memberId === state.memberFilter) && r.measuredAt < state.weekStartMs;
    });
    var weekEnd = state.weekStartMs + 7 * DAY;
    var hasNewer = state.records.some(function (r) {
      return (!state.memberFilter || r.memberId === state.memberFilter) && r.measuredAt >= weekEnd;
    });
    datePrev.disabled = !hasOlder;
    dateNext.disabled = !hasNewer;
  }

  function renderMemberFilter() {
    if (state.members.length < 2) {
      memberFilterEl.hidden = true;
      memberFilterEl.innerHTML = '';
      return;
    }
    memberFilterEl.hidden = false;
    var html = '<button class="member-chip' + (state.memberFilter == null ? ' active' : '') +
      '" type="button" data-member="all"><span class="chip-avatar all">全</span>全部</button>';
    state.members.forEach(function (m) {
      var active = state.memberFilter === m.id;
      html += '<button class="member-chip' + (active ? ' active' : '') + '" type="button" data-member="' +
        m.id + '"><span class="chip-avatar" style="--avatar:' + m.color + '">' + m.short + '</span>' + m.name + '</button>';
    });
    memberFilterEl.innerHTML = html;
  }

  function renderModeUI() {
    $$('.seg-btn').forEach(function (btn) {
      var active = btn.getAttribute('data-mode') === state.mode;
      btn.classList.toggle('active', active);
      btn.setAttribute('aria-selected', active ? 'true' : 'false');
    });
    var index = state.mode === 'single' ? 0 : (state.mode === 'week' ? 1 : 2);
    segThumb.style.setProperty('--seg-index', String(index));
  }

  /* ---------------- 渲染：数字/卡片/表盘 ---------------- */

  function animateNumber(el, target, decimals, duration, delay) {
    var token = (el.__token || 0) + 1;
    el.__token = token;
    var start = performance.now() + (delay || 0);
    var from = 0;
    el.textContent = (0).toFixed(decimals);
    function frame(now) {
      if (el.__token !== token) return;
      if (now < start) {
        requestAnimationFrame(frame);
        return;
      }
      var t = clamp((now - start) / duration, 0, 1);
      var eased = 1 - Math.pow(1 - t, 3);
      el.textContent = (from + (target - from) * eased).toFixed(decimals);
      if (t < 1) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  function setCardNumber(card, key, value, roll, delay) {
    var num = card.querySelector('.num');
    if (!num) return;
    if (value == null) {
      num.__token = (num.__token || 0) + 1;
      num.textContent = '--';
      return;
    }
    if (roll) animateNumber(num, value, METRICS[key].decimals, 400, delay || 0);
    else num.textContent = formatValue(key, value);
  }

  function setStatus(card, info) {
    var pill = card.querySelector('.status-pill');
    if (!pill) return;
    pill.className = 'status-pill ' + info.tone;
    var text = pill.querySelector('span');
    if (text) text.textContent = info.label;
  }

  function setFoot(card, text) {
    var foot = card.querySelector('.card-foot');
    if (foot) foot.textContent = text;
  }

  function setRange(card, key, value, snapshot) {
    var range = card.querySelector('.range');
    if (!range) return;
    var spec = rangeSpec(key, snapshot);
    if (!spec) {
      range.style.visibility = 'hidden';
      return;
    }
    range.style.visibility = value == null ? 'hidden' : 'visible';
    var total = spec.max - spec.min;
    if (total <= 0) return;
    var low = clamp((spec.stdStart - spec.min) / total * 100, 0, 100);
    var ok = clamp((spec.stdEnd - spec.stdStart) / total * 100, 0, 100);
    var high = Math.max(0, 100 - low - ok);
    var segs = range.querySelectorAll('.seg');
    if (segs.length === 3) {
      segs[0].style.width = low + '%';
      segs[1].style.width = ok + '%';
      segs[2].style.width = high + '%';
    }
    var pin = range.querySelector('.range-pin');
    if (pin && value != null) {
      var pos = clamp((value - spec.min) / total * 100, 1.5, 98.5);
      pin.style.left = pos + '%';
    }
  }

  function renderWeightCard(snapshot) {
    var card = cardEls.weight;
    if (!card) return;
    var pill = $('#weightDeltaPill');
    var tag = $('#weightBaselineTag');
    var deltaText = $('#weightDeltaText');
    var foot = $('#weightFoot');
    var weight = snapshot.weight;
    var first = state.isFirst || state.snapshots.length === 1;
    if (weight == null) {
      pill.hidden = true;
      tag.hidden = true;
      foot.textContent = '暂无数据';
      return;
    }
    if (first) {
      card.classList.add('is-baseline');
      pill.hidden = true;
      tag.hidden = false;
      tag.textContent = '基准';
      foot.textContent = '首次基准记录';
      return;
    }
    card.classList.remove('is-baseline');
    var delta = deltaFor(snapshot);
    if (delta == null) {
      pill.hidden = true;
      tag.hidden = true;
      foot.textContent = '暂无对比数据';
      return;
    }
    var abs = Math.abs(delta);
    var sign = delta > 0 ? '+' : (delta < 0 ? '−' : '');
    var text = (delta === 0 ? '0.0' : sign + abs.toFixed(1)) + ' kg';
    pill.hidden = false;
    tag.hidden = true;
    deltaText.textContent = text;
    pill.classList.toggle('up', delta > 0.0001);
    pill.classList.toggle('flat', Math.abs(delta) <= 0.0001);
    foot.innerHTML = '较上次 <b>' + (delta === 0 ? '0.0' : sign + abs.toFixed(1)) + ' kg</b>';
  }

  function renderCards(snapshot, roll) {
    if (!snapshot) return;
    var biaTip = $('#biaTip');
    if (biaTip) biaTip.hidden = !!snapshot.hasBia;
    METRIC_KEYS.forEach(function (key, index) {
      var card = cardEls[key];
      if (!card) return;
      var value = metricValue(snapshot, key);
      var missing = value == null;
      card.classList.toggle('no-data', missing);
      setCardNumber(card, key, value, roll, Math.floor(index / 2) * 50);
      if (key !== 'weight') {
        setStatus(card, missing ? { tone: 'neutral', label: '无数据' } : statusFor(key, value, snapshot));
      }
      setRange(card, key, value, snapshot);
      if (key !== 'weight') {
        setFoot(card, missing ? '暂无数据' : footText(key, value, snapshot));
      }
    });
    renderWeightCard(snapshot);
  }

  function setRing(fraction, animate) {
    var f = clamp(fraction, 0, 1);
    ringProgress.style.transition = animate ? 'stroke-dashoffset .9s cubic-bezier(.22, 1, .36, 1)' : 'none';
    ringProgress.style.strokeDasharray = RING_C + ' ' + RING_C;
    ringProgress.style.strokeDashoffset = String(RING_C * (1 - f));
  }

  function renderDial(snapshot) {
    if (!snapshot) return;
    if (snapshot.weight == null) weightValue.textContent = '--';
    else weightValue.textContent = formatValue('weight', snapshot.weight);

    var first = state.isFirst || state.snapshots.length === 1;
    var delta = deltaFor(snapshot);
    weightDelta.className = 'weight-delta';
    if (first) {
      weightDelta.textContent = '首次基准记录';
      weightDelta.classList.add('flat');
    } else if (delta == null) {
      weightDelta.textContent = '暂无历史对比';
      weightDelta.classList.add('flat');
    } else if (Math.abs(delta) <= 0.0001) {
      weightDelta.textContent = '较上次 0.0 kg';
      weightDelta.classList.add('flat');
    } else {
      var sign = delta > 0 ? '+' : '−';
      weightDelta.textContent = '较上次 ' + sign + Math.abs(delta).toFixed(1) + ' kg';
      if (delta > 0) weightDelta.classList.add('up');
    }
    setRing(snapshot.hasBia ? 1 : 0.25, true);
  }

  function updateStage() {
    var snapshot = currentSnapshot();
    if (!snapshot) return;
    var member = snapshot.member || memberOf(snapshot.memberId) || state.members[0];
    if (member) {
      stageAvatar.textContent = member.short;
      stageAvatar.style.setProperty('--avatar', member.color);
      stageMemberName.textContent = member.name;
    } else {
      stageAvatar.textContent = '全';
      stageAvatar.style.setProperty('--avatar', 'var(--text-tertiary)');
      stageMemberName.textContent = '全部成员';
    }
    var first = state.isFirst || state.snapshots.length === 1;
    var delta = deltaFor(snapshot);
    if (first) {
      insightDelta.textContent = '首次';
      insightDeltaLabel.textContent = ' 基准记录';
    } else if (delta == null) {
      insightDelta.textContent = '—';
      insightDeltaLabel.textContent = ' 暂无对比';
    } else if (Math.abs(delta) <= 0.0001) {
      insightDelta.textContent = '0.0';
      insightDeltaLabel.textContent = ' kg 较上次';
    } else {
      insightDelta.textContent = (delta > 0 ? '+' : '−') + Math.abs(delta).toFixed(1);
      insightDeltaLabel.textContent = ' kg 较上次';
    }
    insightCount.textContent = snapshot.hasBia ? '8' : '2';
  }

  function renderAll(options) {
    options = options || {};
    if (!state.snapshots.length) return;
    if (state.selectedIndex >= state.snapshots.length) state.selectedIndex = 0;
    var snapshot = currentSnapshot();
    todayLabel.textContent = formatToday();
    syncLabel.textContent = state.offline ? '离线缓存' : '已同步';
    $$('.metric-card').forEach(function (card) {
      card.setAttribute('aria-pressed', card.getAttribute('data-metric') === state.selectedMetric ? 'true' : 'false');
    });
    renderModeUI();
    renderTimeline();
    renderMemberFilter();
    renderSheetMeta(snapshot);
    renderDial(snapshot);
    renderCards(snapshot, !!options.roll);
    updateStage();
    if (!trendPanel.hidden) renderChart();
  }

  /* ---------------- 趋势图（SVG 自绘） ---------------- */

  function svgEl(tag, attrs, parent) {
    var el = document.createElementNS(SVGNS, tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (name) {
        el.setAttribute(name, attrs[name]);
      });
    }
    if (parent) parent.appendChild(el);
    return el;
  }

  function svgText(parent, x, y, text, attrs) {
    var el = svgEl('text', attrs || {}, parent);
    el.setAttribute('x', x);
    el.setAttribute('y', y);
    el.textContent = text;
    return el;
  }

  function smoothPath(pts) {
    if (!pts.length) return '';
    if (pts.length === 1) return 'M ' + pts[0].x + ' ' + pts[0].y;
    var d = 'M ' + pts[0].x + ' ' + pts[0].y;
    for (var i = 0; i < pts.length - 1; i++) {
      var p0 = pts[i - 1] || pts[i];
      var p1 = pts[i];
      var p2 = pts[i + 1];
      var p3 = pts[i + 2] || pts[i + 1];
      var c1x = p1.x + (p2.x - p0.x) / 6;
      var c1y = p1.y + (p2.y - p0.y) / 6;
      var c2x = p2.x - (p3.x - p1.x) / 6;
      var c2y = p2.y - (p3.y - p1.y) / 6;
      d += ' C ' + c1x + ' ' + c1y + ', ' + c2x + ' ' + c2y + ', ' + p2.x + ' ' + p2.y;
    }
    return d;
  }

  function renderChart() {
    if (trendPanel.hidden) return;
    var snapshot = currentSnapshot();
    if (!snapshot) return;
    var key = state.selectedMetric;
    var def = METRICS[key];
    var w = Math.max(240, Math.round(trendChartWrap.clientWidth || 319));
    var h = 180;
    var cs = getComputedStyle(app);
    var colorOf = function (name) { return cs.getPropertyValue(name).trim(); };
    var metricCard = cardEls[key];
    var accent = metricCard ? getComputedStyle(metricCard).getPropertyValue('--metric-accent').trim() : '';
    if (!accent) accent = colorOf('--primary');
    var primary = accent;
    var cardColor = colorOf('--card');
    var divider = colorOf('--divider');
    var textTer = colorOf('--text-tertiary');
    var primarySoft = colorOf('--primary-soft');

    var series = [];
    for (var i = state.snapshots.length - 1; i >= 0; i--) {
      var v = metricValue(state.snapshots[i], key);
      if (v != null) series.push({ i: i, v: v, s: state.snapshots[i] });
    }

    var currentValue = metricValue(snapshot, key);
    trendTitle.textContent = def.title + '趋势';
    trendSub.textContent = MODE_LABEL[state.mode] + ' · ' + series.length + ' 个数据点';
    trendValue.textContent = currentValue == null ? '--' : formatValue(key, currentValue);
    trendUnit.textContent = def.unit;

    var older = state.snapshots[state.selectedIndex + 1];
    var olderValue = older ? metricValue(older, key) : null;
    if (currentValue != null && olderValue != null) {
      var dv = currentValue - olderValue;
      trendDelta.hidden = false;
      trendDelta.textContent = (dv > 0 ? '+' : (dv < 0 ? '−' : '')) + Math.abs(dv).toFixed(def.decimals);
      trendDelta.className = 'trend-delta' + (dv > 0.0001 ? ' up' : '');
    } else {
      trendDelta.hidden = true;
    }

    while (chartSvg.firstChild) chartSvg.removeChild(chartSvg.firstChild);
    chartSvg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    chartSvg.setAttribute('width', String(w));
    chartSvg.setAttribute('height', String(h));
    chartSvg.setAttribute('aria-label', def.title + '趋势，共 ' + series.length + ' 个数据点');
    state.chartW = w;

    var defs = svgEl('defs', {}, chartSvg);
    var grad = svgEl('linearGradient', {
      id: 'chartAreaGrad', x1: '0', y1: '0', x2: '0', y2: '1'
    }, defs);
    svgEl('stop', { offset: '0', 'stop-color': primary, 'stop-opacity': '.26' }, grad);
    svgEl('stop', { offset: '1', 'stop-color': primary, 'stop-opacity': '0' }, grad);

    if (!series.length) {
      svgText(chartSvg, w / 2, h / 2 - 4, '暂无可对比的趋势数据', {
        'text-anchor': 'middle',
        fill: textTer,
        'font-size': '10'
      });
      chartNote.hidden = false;
      chartNote.textContent = '本次暂无该指标的历史数据';
      state.chartPoints = [];
      return;
    }

    var left = 6;
    var right = w - 12;
    var top = 22;
    var bottom = h - 28;
    var plotW = Math.max(10, right - left);
    var plotH = Math.max(10, bottom - top);
    var values = series.map(function (p) { return p.v; });
    var vmin = Math.min.apply(null, values);
    var vmax = Math.max.apply(null, values);
    if (vmax - vmin < 0.001) {
      var pad0 = Math.max(Math.abs(vmax) * 0.06, 1);
      vmin -= pad0;
      vmax += pad0;
    } else {
      var pad = (vmax - vmin) * 0.22;
      vmin -= pad;
      vmax += pad;
    }

    function xFor(index) {
      if (series.length === 1) return (left + right) / 2;
      return left + (index / (series.length - 1)) * plotW;
    }
    function yFor(value) {
      return top + (vmax - value) / (vmax - vmin) * plotH;
    }

    [0, 0.5, 1].forEach(function (t) {
      var y = top + plotH * t;
      svgEl('line', {
        x1: left, y1: y, x2: right, y2: y,
        stroke: divider, 'stroke-width': '1', 'stroke-dasharray': '2 5', opacity: '.8'
      }, chartSvg);
      svgText(chartSvg, right, y - 4, formatValue(key, vmax - (vmax - vmin) * t), {
        'text-anchor': 'end',
        fill: textTer,
        'font-size': '7.5',
        opacity: '.72'
      });
    });

    var pts = series.map(function (p, idx) {
      return { x: xFor(idx), y: yFor(p.v), v: p.v, i: p.i, s: p.s };
    });

    var linePath = smoothPath(pts);
    if (pts.length > 1) {
      var areaPath = linePath + ' L ' + pts[pts.length - 1].x + ' ' + bottom +
        ' L ' + pts[0].x + ' ' + bottom + ' Z';
      svgEl('path', { d: areaPath, fill: 'url(#chartAreaGrad)', stroke: 'none' }, chartSvg);
      svgEl('path', {
        d: linePath, fill: 'none', stroke: primary, 'stroke-width': '2',
        'stroke-linecap': 'round', 'stroke-linejoin': 'round'
      }, chartSvg);
    }

    var selectedPoint = null;
    pts.forEach(function (p) {
      if (p.i === state.selectedIndex) {
        selectedPoint = p;
        return;
      }
      svgEl('circle', {
        cx: p.x, cy: p.y, r: '2.3', fill: primary,
        stroke: cardColor, 'stroke-width': '1.2', opacity: '.88'
      }, chartSvg);
    });

    var indices = [];
    if (pts.length === 1) indices = [0];
    else indices = [0, Math.floor((pts.length - 1) / 2), pts.length - 1];
    var seen = {};
    indices.forEach(function (idx) {
      if (seen[idx]) return;
      seen[idx] = true;
      var p = pts[idx];
      var anchor = pts.length === 1 ? 'middle' : (idx === 0 ? 'start' : (idx === pts.length - 1 ? 'end' : 'middle'));
      var x = pts.length === 1 ? (left + right) / 2 : (idx === 0 ? left : (idx === pts.length - 1 ? right : p.x));
      svgText(chartSvg, x, h - 8, p.s.label, {
        'text-anchor': anchor,
        fill: textTer,
        'font-size': '8'
      });
    });

    if (pts.length === 1) {
      var sp = pts[0];
      svgEl('line', {
        x1: left, y1: sp.y, x2: right, y2: sp.y,
        stroke: divider, 'stroke-width': '1', 'stroke-dasharray': '3 5', opacity: '.9'
      }, chartSvg);
      svgEl('circle', {
        cx: sp.x, cy: sp.y, r: '15', fill: primary, opacity: '.12', 'class': 'chart-pulse'
      }, chartSvg);
      svgEl('circle', { cx: sp.x, cy: sp.y, r: '7', fill: primary, opacity: '.16' }, chartSvg);
      svgEl('circle', {
        cx: sp.x, cy: sp.y, r: '4.8', fill: primary, stroke: cardColor, 'stroke-width': '2'
      }, chartSvg);
      svgText(chartSvg, sp.x, Math.max(sp.y - 14, 12), formatValue(key, sp.v), {
        'text-anchor': 'middle',
        fill: cardColor,
        'font-size': '9',
        'font-weight': '650'
      });
    } else if (selectedPoint) {
      svgEl('line', {
        x1: selectedPoint.x, y1: selectedPoint.y, x2: selectedPoint.x, y2: bottom,
        stroke: primary, 'stroke-width': '1', 'stroke-dasharray': '3 4', opacity: '.22'
      }, chartSvg);
      svgEl('circle', {
        cx: selectedPoint.x, cy: selectedPoint.y, r: '10',
        fill: primary, opacity: '.13', 'class': 'chart-pulse'
      }, chartSvg);
      svgEl('circle', {
        cx: selectedPoint.x, cy: selectedPoint.y, r: '4.6',
        fill: primary, stroke: cardColor, 'stroke-width': '2'
      }, chartSvg);
      svgText(chartSvg, selectedPoint.x, Math.max(selectedPoint.y - 12, 12), formatValue(key, selectedPoint.v), {
        'text-anchor': 'middle',
        fill: cardColor,
        'font-size': '9',
        'font-weight': '650'
      });
    }

    chartNote.hidden = pts.length !== 1;
    if (pts.length === 1) chartNote.textContent = '再测一次即可连成趋势曲线';

    state.chartPoints = pts.map(function (p) {
      return { x: p.x, index: p.i };
    });
  }

  /* ---------------- 抽屉几何与弹簧 ---------------- */

  function anchorsPx() {
    var h = app.clientHeight || 812;
    return { full: 0, half: h * ANCHOR.half, collapsed: h * ANCHOR.collapsed };
  }

  function applySheet(offset) {
    var A = anchorsPx();
    var y = clamp(offset, 0, A.collapsed);
    state.sheetOffset = y;
    sheet.style.transform = 'translate3d(0, ' + y + 'px, 0)';

    var scale;
    var ty;
    if (y >= A.half) {
      var p = clamp((A.collapsed - y) / (A.collapsed - A.half), 0, 1);
      scale = 1 - 0.28 * p;
      ty = -80 * p;
    } else {
      var q = clamp((A.half - y) / A.half, 0, 1);
      scale = 0.72 - 0.22 * q;
      ty = -80 - 16 * q;
    }
    stage.style.transform = 'translate3d(0, ' + ty + 'px, 0) scale(' + scale + ')';

    var sp = clamp((A.half - y) / A.half, 0, 1);
    scrim.style.opacity = String(0.45 * sp);
    scrim.style.pointerEvents = sp > 0.02 ? 'auto' : 'none';

    var nearFull = y < 10;
    var nearCollapsed = y > A.collapsed - 36;
    app.dataset.sheet = nearFull ? 'full' : (nearCollapsed ? 'collapsed' : 'half');
    sheet.classList.toggle('is-full', nearFull);
    sheet.classList.toggle('is-collapsed', nearCollapsed);

    if (nearFull && trendPanel.hidden) {
      trendPanel.hidden = false;
      requestAnimationFrame(renderChart);
    } else if (!nearFull && !trendPanel.hidden) {
      trendPanel.hidden = true;
    }
  }

  function finishSheet(anchor) {
    var wasFull = state.sheetAnchor === 'full';
    state.sheetAnchor = anchor;
    state.sheetTarget = anchor;
    app.dataset.sheet = anchor;
    sheet.classList.toggle('is-full', anchor === 'full');
    sheet.classList.toggle('is-collapsed', anchor === 'collapsed');
    trendPanel.hidden = anchor !== 'full';
    var pad = Math.round(state.sheetOffset) + 24;
    sheetBody.style.paddingBottom = 'calc(' + pad + 'px + env(safe-area-inset-bottom))';
    sheetToggle.setAttribute('aria-label', anchor === 'full' ? '收起到半屏' : '展开完整报告');
    if (anchor === 'full') {
      requestAnimationFrame(renderChart);
      if (!wasFull) requestAnimationFrame(function () { sheetBody.scrollTo({ top: 0, behavior: 'smooth' }); });
    }
  }

  function cancelSpring() {
    if (springRaf) cancelAnimationFrame(springRaf);
    springRaf = 0;
    state.springing = false;
  }

  function springTo(target, anchor) {
    cancelSpring();
    var k = 280;
    var zeta = 0.82;
    var c = 2 * zeta * Math.sqrt(k);
    var x = state.sheetOffset;
    var v = state.releaseVelocity || 0;
    state.releaseVelocity = 0;
    state.springing = true;
    var last = performance.now();
    function frame(now) {
      var dt = Math.min(0.032, Math.max(0.001, (now - last) / 1000));
      last = now;
      var accel = -k * (x - target) - c * v;
      v += accel * dt;
      x += v * dt;
      if (Math.abs(x - target) < 0.5 && Math.abs(v) < 5) {
        x = target;
        applySheet(x);
        state.springing = false;
        finishSheet(anchor);
        return;
      }
      applySheet(x);
      springRaf = requestAnimationFrame(frame);
    }
    springRaf = requestAnimationFrame(frame);
  }

  function nearestAnchor(offset) {
    var A = anchorsPx();
    var best = 'half';
    var bestDistance = Infinity;
    ['full', 'half', 'collapsed'].forEach(function (name) {
      var d = Math.abs(A[name] - offset);
      if (d < bestDistance) {
        bestDistance = d;
        best = name;
      }
    });
    return best;
  }

  function sheetTo(anchor, mode) {
    anchor = normalizeSheet(anchor) || 'half';
    var A = anchorsPx();
    state.sheetTarget = anchor;
    if (mode === 'instant') {
      cancelSpring();
      state.dragging = false;
      sheetHead.classList.remove('is-dragging');
      applySheet(A[anchor]);
      finishSheet(anchor);
      return;
    }
    springTo(A[anchor], anchor);
  }

  function selectSnapshot(index, scroll) {
    if (index < 0 || index >= state.snapshots.length) return;
    state.selectedIndex = index;
    renderTimeline();
    var snapshot = currentSnapshot();
    renderSheetMeta(snapshot);
    renderDial(snapshot);
    renderCards(snapshot, false);
    updateStage();
    if (!trendPanel.hidden) renderChart();
    if (scroll) scrollChip(index);
  }

  function scrollChip(index) {
    var chip = timelineEl.querySelector('[data-index="' + index + '"]');
    if (!chip) return;
    var tr = timelineEl.getBoundingClientRect();
    var cr = chip.getBoundingClientRect();
    var delta = (cr.left - tr.left) - (tr.width - cr.width) / 2;
    timelineEl.scrollBy({ left: delta, behavior: 'smooth' });
  }

  function selectMetric(metric) {
    if (!METRICS[metric]) return;
    state.selectedMetric = metric;
    $$('.metric-card').forEach(function (card) {
      card.setAttribute('aria-pressed', card.getAttribute('data-metric') === metric ? 'true' : 'false');
    });
    if (state.sheetAnchor !== 'full') {
      sheetTo('full', 'spring');
      setTimeout(function () {
        sheetBody.scrollTo({ top: 0, behavior: 'smooth' });
        if (!trendPanel.hidden) renderChart();
      }, 420);
    } else {
      if (!trendPanel.hidden) renderChart();
      sheetBody.scrollTo({ top: 0, behavior: 'smooth' });
    }
  }

  function setMode(mode) {
    if (!MODE_LABEL[mode] || state.mode === mode) return;
    state.mode = mode;
    state.snapshots = buildSnapshots(mode, state.memberFilter);
    state.selectedIndex = 0;
    renderAll({ instant: true });
    timelineEl.scrollLeft = 0;
  }

  function setMemberFilter(id) {
    state.memberFilter = id;
    state.snapshots = buildSnapshots(state.mode, id);
    state.selectedIndex = 0;
    renderAll({ instant: true });
    timelineEl.scrollLeft = 0;
  }

  function shiftWeek(delta) {
    state.weekStartMs += delta * 7 * DAY;
    state.snapshots = buildSnapshots(state.mode, state.memberFilter);
    state.selectedIndex = 0;
    renderAll({ instant: true });
    timelineEl.scrollLeft = 0;
  }

  /* ---------------- 时序与状态 ---------------- */

  function updatePhaseUI() {
    app.dataset.phase = state.phase;
    var view = statusView();
    statusText.textContent = view.text;
    statusDot.setAttribute('data-tone', view.tone);
    dialCaption.textContent = captionView();

    var label = actionView();
    actionLabel.textContent = label;
    primaryAction.disabled = state.phase === 'locked' || state.phase === 'calculating';
    dial.classList.toggle('is-scanning', state.phase === 'calculating');
  }

  function statusView() {
    if (state.phase === 'offline') return { text: '未连接设备 · 点击唤醒测量', tone: 'slate' };
    if (state.phase === 'locked') return { text: '体重已锁定', tone: 'blue' };
    if (state.phase === 'calculating') return { text: '正在分析体成分', tone: 'amber' };
    if (state.phase === 'complete') {
      if (state.demo === 'nobia') return { text: '已记录体重 · 缺少体成分', tone: 'amber' };
      if (state.demo === 'first') return { text: '首次基准已建立', tone: 'green' };
      return { text: '报告已生成', tone: 'green' };
    }
    return { text: '设备已连接', tone: 'green' };
  }

  function captionView() {
    if (state.phase === 'offline') return '展示最近一次同步数据 · 点击按钮重新连接';
    if (state.phase === 'locked') return '体重已锁定，正在读取生物电阻抗';
    if (state.phase === 'calculating') return '正在生成体成分报告';
    if (state.phase === 'complete') {
      if (state.demo === 'nobia') return '未检测到赤足接触，仅记录体重与 BMI';
      if (state.demo === 'first') return '这是你的第一份身体报告';
      return '8 项指标已更新 · 数据已同步';
    }
    return '赤足站立 3 秒，获取 8 项体成分';
  }

  function actionView() {
    if (state.phase === 'offline') return '连接设备';
    if (state.phase === 'locked') return '测量完成';
    if (state.phase === 'calculating') return '分析中…';
    if (state.phase === 'complete') return '再测一次';
    return '开始测量';
  }

  function flashLocked() {
    dial.classList.remove('is-locked');
    void dial.offsetWidth;
    dial.classList.add('is-locked');
    setTimeout(function () { dial.classList.remove('is-locked'); }, 660);
  }

  function startScramble() {
    stopScramble();
    var snapshot = currentSnapshot();
    if (!snapshot || snapshot.weight == null) return;
    var target = snapshot.weight;
    scrambleTimer = setInterval(function () {
      var jitter = (Math.random() - 0.5) * 1.1;
      weightValue.textContent = (target + jitter).toFixed(1);
    }, 70);
  }

  function stopScramble() {
    if (scrambleTimer) clearInterval(scrambleTimer);
    scrambleTimer = 0;
  }

  function stopSequence() {
    seqTimers.forEach(function (t) { clearTimeout(t); });
    seqTimers = [];
    state.seqRunning = false;
    stopScramble();
    dial.classList.remove('is-scanning', 'is-locked');
  }

  function runSequence() {
    stopSequence();
    state.seqRunning = true;
    state.offline = false;

    var snapshot = currentSnapshot();
    hideCards();
    sheetBody.scrollTop = 0;
    sheetTo('collapsed', 'instant');
    state.phase = 'locked';
    updatePhaseUI();
    flashLocked();
    setRing(0, false);
    if (snapshot && snapshot.weight != null) weightValue.textContent = formatValue('weight', snapshot.weight);

    seqTimers.push(setTimeout(function () {
      state.phase = 'calculating';
      updatePhaseUI();
      setRing(snapshot && snapshot.hasBia ? 1 : 0.25, true);
      startScramble();
    }, 300));

    seqTimers.push(setTimeout(function () {
      stopScramble();
      if (snapshot && snapshot.weight != null) weightValue.textContent = formatValue('weight', snapshot.weight);
    }, 1300));

    seqTimers.push(setTimeout(function () {
      sheetTo('half', 'spring');
    }, 1300));

    seqTimers.push(setTimeout(function () {
      state.phase = 'complete';
      updatePhaseUI();
      renderAll({ instant: true, roll: true });
      revealCards(true);
    }, 1500));

    seqTimers.push(setTimeout(function () {
      state.seqRunning = false;
    }, 2600));
  }

  function hideCards() {
    grid.classList.remove('is-revealed');
    grid.classList.remove('instant');
    $$('.metric-card', grid).forEach(function (card) {
      card.style.transitionDelay = '';
    });
  }

  function revealCards(animate) {
    var cards = $$('.metric-card', grid);
    clearTimeout(revealTimer);
    cards.forEach(function (card) { card.style.transitionDelay = ''; });
    if (!animate) {
      grid.classList.add('instant');
      grid.classList.add('is-revealed');
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { grid.classList.remove('instant'); });
      });
      return;
    }
    grid.classList.remove('instant');
    grid.classList.remove('is-revealed');
    void grid.offsetWidth;
    cards.forEach(function (card, i) {
      card.style.transitionDelay = (Math.floor(i / 2) * 50) + 'ms';
    });
    requestAnimationFrame(function () { grid.classList.add('is-revealed'); });
    revealTimer = setTimeout(function () {
      cards.forEach(function (card) { card.style.transitionDelay = ''; });
    }, 950);
  }

  /* ---------------- 演示状态 ---------------- */

  function normalizeDemo(value) {
    if (!value) return null;
    var v = String(value).toLowerCase();
    if (v === 'nobia' || v === 'no-bia' || v === 'no_bia' || v === 'no bia') return 'nobia';
    if (v === 'normal' || v === 'first' || v === 'offline') return v;
    return null;
  }

  function normalizeSheet(value) {
    if (value == null) return null;
    var v = String(value).toLowerCase();
    if (v === 'full' || v === '2') return 'full';
    if (v === 'half' || v === '1') return 'half';
    if (v === 'collapsed' || v === '0') return 'collapsed';
    return null;
  }

  function normalizeTheme(value) {
    if (!value) return null;
    var v = String(value).toLowerCase();
    if (v === 'dark') return 'dark';
    if (v === 'light') return 'light';
    return null;
  }

  function applyDemo(name, options) {
    options = options || {};
    var demo = normalizeDemo(name) || 'normal';
    stopSequence();
    state.demo = demo;
    state.members = demo === 'first' ? [MEMBERS[0]] : MEMBERS.slice();
    state.records = buildDemoRecords(demo);
    state.isFirst = demo === 'first';
    state.offline = demo === 'offline';
    state.mode = 'single';
    state.memberFilter = state.members[0].id;
    state.selectedMetric = 'weight';
    state.selectedIndex = 0;
    state.weekStartMs = state.records.length ? weekStart(state.records[0].measuredAt) : weekStart(Date.now());
    state.snapshots = buildSnapshots('single', state.memberFilter);
    state.phase = demo === 'offline' ? 'offline' : 'complete';
    app.dataset.demo = demo;
    sheetBody.scrollTop = 0;
    updateDemoButtons();
    renderAll({ instant: true });
    updatePhaseUI();
    if (!options.keepSheet) {
      sheetTo('half', options.instantSheet ? 'instant' : 'spring');
    }
    if (!options.hideCards) revealCards(false);
    else hideCards();
  }

  function updateDemoButtons() {
    $$('.demo-state').forEach(function (btn) {
      var active = btn.getAttribute('data-state') === state.demo;
      btn.classList.toggle('active', active);
      btn.setAttribute('aria-pressed', active ? 'true' : 'false');
    });
  }

  function updateThemeButtons() {
    $$('.demo-theme').forEach(function (btn) {
      var active = btn.getAttribute('data-theme-choice') === state.theme;
      btn.classList.toggle('active', active);
      btn.setAttribute('aria-pressed', active ? 'true' : 'false');
    });
  }

  function setTheme(theme, silent) {
    state.theme = theme === 'dark' ? 'dark' : 'light';
    app.dataset.theme = state.theme;
    document.documentElement.style.colorScheme = state.theme;
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', state.theme === 'dark' ? '#0B0F19' : '#F1F5F9');
    updateThemeButtons();
    if (!silent && !trendPanel.hidden) renderChart();
  }

  function showToast(text) {
    if (!toast) return;
    toast.textContent = text;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 1800);
  }

  /* ---------------- 布局/拖动 ---------------- */

  function layoutDevice() {
    var mobile = window.innerWidth <= 640;
    document.body.classList.toggle('is-mobile', mobile);
    if (mobile) {
      device.style.width = '100vw';
      device.style.height = '100dvh';
      phone.style.transform = 'none';
    } else {
      var fit = Math.min(1, (window.innerHeight - 56) / 812);
      device.style.width = (375 * fit) + 'px';
      device.style.height = (812 * fit) + 'px';
      phone.style.transform = 'scale(' + fit + ')';
      phone.style.transformOrigin = 'top left';
    }
  }

  function pointerDown(e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (e.target.closest('.sheet-controls')) return;
    if (e.target.closest('button, a, input, select, textarea')) return;
    e.preventDefault();
    cancelSpring();
    state.dragging = true;
    state.dragStartY = e.clientY;
    state.dragStartOffset = state.sheetOffset;
    state.dragMoved = 0;
    state.dragSamples = [{ t: performance.now(), y: state.sheetOffset }];
    sheetHead.classList.add('is-dragging');
    try { sheetHead.setPointerCapture(e.pointerId); } catch (err) {}
  }

  function pointerMove(e) {
    if (!state.dragging) return;
    e.preventDefault();
    var A = anchorsPx();
    var rect = phone.getBoundingClientRect();
    var scale = (rect.height / (phone.offsetHeight || 812)) || 1;
    var next = clamp(state.dragStartOffset + (e.clientY - state.dragStartY) / scale, 0, A.collapsed);
    state.dragMoved = Math.max(state.dragMoved, Math.abs(e.clientY - state.dragStartY) / scale);
    applySheet(next);
    state.dragSamples.push({ t: performance.now(), y: next });
    if (state.dragSamples.length > 14) state.dragSamples.shift();
  }

  function pointerUp() {
    if (!state.dragging) return;
    state.dragging = false;
    sheetHead.classList.remove('is-dragging');
    var now = performance.now();
    var recent = state.dragSamples.filter(function (s) { return now - s.t < 140; });
    var velocity = 0;
    if (recent.length > 1) {
      var first = recent[0];
      var last = recent[recent.length - 1];
      var dt = (last.t - first.t) / 1000;
      if (dt > 0.008) velocity = (last.y - first.y) / dt;
    }
    state.releaseVelocity = velocity;
    var A = anchorsPx();
    var target;
    if (state.dragMoved < 4) {
      if (state.sheetOffset > A.half) target = 'half';
      else if (state.sheetOffset < 10) target = 'half';
      else target = 'full';
    } else if (Math.abs(velocity) > 400) {
      if (velocity < 0) target = state.sheetOffset > A.half ? 'half' : 'full';
      else target = state.sheetOffset < A.half ? 'half' : 'collapsed';
    } else {
      target = nearestAnchor(state.sheetOffset);
    }
    springTo(A[target], target);
  }

  function pointerCancel() {
    if (!state.dragging) return;
    state.dragging = false;
    state.releaseVelocity = 0;
    sheetHead.classList.remove('is-dragging');
    springTo(anchorsPx()[nearestAnchor(state.sheetOffset)], nearestAnchor(state.sheetOffset));
  }

  function connectAndMeasure() {
    if (state.demo === 'offline') {
      applyDemo('normal', { keepSheet: true, hideCards: true });
      showToast('设备已连接');
    }
    runSequence();
  }

  /* ---------------- 事件 ---------------- */

  function bindEvents() {
    sheetHead.addEventListener('pointerdown', pointerDown);
    sheetHead.addEventListener('pointermove', pointerMove);
    sheetHead.addEventListener('pointerup', pointerUp);
    sheetHead.addEventListener('pointercancel', pointerCancel);
    sheetHead.addEventListener('lostpointercapture', function () {
      if (state.dragging) pointerCancel();
    });

    scrim.addEventListener('click', function () {
      if (state.sheetAnchor === 'full') sheetTo('half', 'spring');
      else if (state.sheetAnchor === 'half') sheetTo('collapsed', 'spring');
    });

    sheetToggle.addEventListener('click', function () {
      if (state.sheetAnchor === 'full') sheetTo('half', 'spring');
      else if (state.sheetAnchor === 'half') sheetTo('full', 'spring');
      else sheetTo('half', 'spring');
    });

    $('#modeControl').addEventListener('click', function (e) {
      var btn = e.target.closest('.seg-btn');
      if (btn) setMode(btn.getAttribute('data-mode'));
    });

    timelineEl.addEventListener('click', function (e) {
      var chip = e.target.closest('.tl-chip');
      if (!chip) return;
      selectSnapshot(Number(chip.getAttribute('data-index')), true);
    });

    datePrev.addEventListener('click', function () {
      shiftWeek(-1);
    });
    dateNext.addEventListener('click', function () {
      shiftWeek(1);
    });

    memberFilterEl.addEventListener('click', function (e) {
      var chip = e.target.closest('.member-chip');
      if (!chip) return;
      var id = chip.getAttribute('data-member');
      setMemberFilter(id === 'all' ? null : id);
    });

    grid.addEventListener('click', function (e) {
      var card = e.target.closest('.metric-card');
      if (!card) return;
      selectMetric(card.getAttribute('data-metric'));
    });

    primaryAction.addEventListener('click', function () {
      if (primaryAction.disabled) return;
      connectAndMeasure();
    });

    $('#statusCapsule').addEventListener('click', function () {
      if (state.demo === 'offline') {
        connectAndMeasure();
        return;
      }
      if (state.sheetAnchor === 'collapsed') sheetTo('half', 'spring');
      else if (state.sheetAnchor === 'half') sheetTo('full', 'spring');
      else sheetTo('half', 'spring');
    });

    $('#stageMember').addEventListener('click', function () {
      var index = -1;
      for (var i = 0; i < state.members.length; i++) {
        if (state.members[i].id === state.memberFilter) { index = i; break; }
      }
      var next = state.members[(index + 1) % state.members.length];
      setMemberFilter(next.id);
      showToast('已切换到 ' + next.name);
    });

    $('#replayBtn').addEventListener('click', function () {
      connectAndMeasure();
      if (window.innerWidth <= 1100) closeDemoPanel();
    });

    $$('.demo-state').forEach(function (btn) {
      btn.addEventListener('click', function () {
        applyDemo(btn.getAttribute('data-state'));
        if (window.innerWidth <= 1100) closeDemoPanel();
      });
    });

    $$('.demo-theme').forEach(function (btn) {
      btn.addEventListener('click', function () {
        setTheme(btn.getAttribute('data-theme-choice'));
      });
    });

    demoFab.addEventListener('click', function () {
      var open = demoPanel.classList.toggle('open');
      demoFab.classList.toggle('is-open', open);
      demoFab.setAttribute('aria-expanded', open ? 'true' : 'false');
      demoFab.textContent = open ? '关闭' : '演示';
    });

    chartSvg.addEventListener('click', function (e) {
      if (!state.chartPoints.length) return;
      var rect = chartSvg.getBoundingClientRect();
      var x = (e.clientX - rect.left) / rect.width * state.chartW;
      var best = null;
      var bestDistance = Infinity;
      state.chartPoints.forEach(function (p) {
        var d = Math.abs(p.x - x);
        if (d < bestDistance) { bestDistance = d; best = p; }
      });
      if (best && bestDistance < 36) selectSnapshot(best.index, true);
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        if (state.sheetAnchor === 'full') sheetTo('half', 'spring');
        else if (state.sheetAnchor === 'half') sheetTo('collapsed', 'spring');
      }
    });

    window.addEventListener('resize', function () {
      clearTimeout(window.__resizeTimer);
      window.__resizeTimer = setTimeout(function () {
        cancelSpring();
        layoutDevice();
        if (state.snapshots.length) {
          applySheet(anchorsPx()[state.sheetAnchor]);
          finishSheet(state.sheetAnchor);
        }
        if (!trendPanel.hidden) renderChart();
      }, 120);
    });

    window.addEventListener('orientationchange', function () {
      setTimeout(function () {
        layoutDevice();
        applySheet(anchorsPx()[state.sheetAnchor]);
        finishSheet(state.sheetAnchor);
        if (!trendPanel.hidden) renderChart();
      }, 220);
    });
  }

  function closeDemoPanel() {
    demoPanel.classList.remove('open');
    demoFab.classList.remove('is-open');
    demoFab.setAttribute('aria-expanded', 'false');
    demoFab.textContent = '演示';
  }

  function buildTicks() {
    var group = $('#dialTicks');
    if (!group) return;
    for (var i = 0; i < 60; i++) {
      var angle = (i / 60) * Math.PI * 2 - Math.PI / 2;
      var major = i % 5 === 0;
      var r1 = 104;
      var r2 = major ? 110 : 107.5;
      var line = document.createElementNS(SVGNS, 'line');
      line.setAttribute('x1', String(120 + Math.cos(angle) * r1));
      line.setAttribute('y1', String(120 + Math.sin(angle) * r1));
      line.setAttribute('x2', String(120 + Math.cos(angle) * r2));
      line.setAttribute('y2', String(120 + Math.sin(angle) * r2));
      line.setAttribute('class', major ? 'major' : 'minor');
      group.appendChild(line);
    }
  }

  function exposeDebugApi() {
    window.__setDemo = function (name) {
      var demo = normalizeDemo(name);
      if (!demo) return false;
      applyDemo(demo);
      return true;
    };
    window.__setSheet = function (anchor) {
      var a = normalizeSheet(anchor);
      if (!a) return false;
      sheetBody.scrollTop = 0;
      sheetTo(a, 'instant');
      revealCards(false);
      return true;
    };
    window.__setTheme = function (theme) {
      var t = normalizeTheme(theme);
      if (!t) return false;
      setTheme(t);
      return true;
    };
    window.__replay = function () { connectAndMeasure(); return true; };
    window.__state = function () {
      return {
        demo: state.demo,
        theme: state.theme,
        mode: state.mode,
        memberFilter: state.memberFilter,
        sheet: state.sheetAnchor,
        metric: state.selectedMetric,
        selectedIndex: state.selectedIndex,
        snapshots: state.snapshots.length,
        phase: state.phase,
        hasBia: currentSnapshot() ? currentSnapshot().hasBia : null
      };
    };
  }

  function init() {
    layoutDevice();
    buildTicks();
    bindEvents();
    exposeDebugApi();

    applySheet(anchorsPx().collapsed);
    finishSheet('collapsed');

    var params = new URLSearchParams(window.location.search);
    var hasParams = params.has('theme') || params.has('demo') || params.has('sheet');
    var theme = normalizeTheme(params.get('theme')) || 'light';
    var demo = normalizeDemo(params.get('demo')) || 'normal';
    setTheme(theme, true);
    applyDemo(demo, { keepSheet: true, hideCards: true });

    if (hasParams) {
      var anchor = normalizeSheet(params.get('sheet')) || 'half';
      sheetTo(anchor, 'instant');
      revealCards(false);
      if (!trendPanel.hidden) requestAnimationFrame(renderChart);
    } else if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      sheetTo('half', 'instant');
      revealCards(false);
    } else {
      seqTimers.push(setTimeout(runSequence, 700));
    }
  }

  init();
})();
</script>
</body>
</html>
