<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F1F5F9">
<title>身体报告 · 交互原型</title>
<style>
/* ============================================================
   身体报告单页原型 · 375 x 812 设计基准
   Z-0 背景微光 / Z-10 主舞台 / Z-20 遮罩 / Z-30 抽屉
   仅使用系统字体，无外部资源，无构建。
   ============================================================ */
:root { color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
html { background: #06080d; }
body {
  margin: 0;
  min-height: 100svh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 28px;
  overflow: auto;
  background:
    radial-gradient(900px 620px at 50% -10%, rgba(37, 99, 235, .20), transparent 62%),
    radial-gradient(760px 560px at 88% 88%, rgba(6, 182, 212, .12), transparent 62%),
    radial-gradient(640px 520px at 8% 78%, rgba(139, 92, 246, .12), transparent 64%),
    #06080d;
  color: #e2e8f0;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
    "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei",
    Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-tap-highlight-color: transparent;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background-image:
    linear-gradient(rgba(148, 163, 184, .035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(148, 163, 184, .035) 1px, transparent 1px);
  background-size: 64px 64px;
  -webkit-mask-image: radial-gradient(80% 60% at 50% 45%, #000, transparent 82%);
  mask-image: radial-gradient(80% 60% at 50% 45%, #000, transparent 82%);
}
button {
  margin: 0;
  padding: 0;
  border: 0;
  background: none;
  color: inherit;
  font: inherit;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
button:disabled { cursor: default; }
[hidden] { display: none !important; }

/* ---------- 手机框 ---------- */
.device {
  position: relative;
  width: 375px;
  height: 812px;
  flex: none;
  z-index: 1;
}
.phone {
  position: absolute;
  inset: 0;
  width: 375px;
  height: 812px;
  overflow: hidden;
  border-radius: 46px;
  background: #f1f5f9;
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, .12),
    0 2px 0 1px rgba(255, 255, 255, .05) inset,
    0 40px 90px -26px rgba(0, 0, 0, .88),
    0 0 130px -42px rgba(56, 189, 248, .38);
  transform-origin: top left;
  will-change: transform;
}
.phone::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 200;
  border-radius: inherit;
  pointer-events: none;
  box-shadow:
    inset 0 0 0 1px rgba(255, 255, 255, .10),
    inset 0 1px 0 rgba(255, 255, 255, .16);
}
body.is-mobile {
  display: block;
  padding: 0;
  overflow: hidden;
  background: #06080d;
}
body.is-mobile .device { width: 100vw; height: 100dvh; }
body.is-mobile .phone {
  width: 100%;
  height: 100%;
  border-radius: 0;
  box-shadow: none;
}
body.is-mobile .phone::after { display: none; }

/* ---------- 设计 token（交付方案浅/深色） ---------- */
.app {
  position: absolute;
  inset: 0;
  overflow: hidden;
  background: var(--bg);
  color: var(--text-primary);
  font-family: inherit;
  transition: background-color .35s ease, color .35s ease;

  --bg: #F5F6F8;
  --bg-rgb: 245, 246, 248;
  --sheet: #FFFFFF;
  --sheet-rgb: 255, 255, 255;
  --sheet-border: rgba(255, 255, 255, .82);
  --card: #FFFFFF;
  --card-selected: #EFF6FF;
  --card-border: rgba(15, 23, 42, .055);
  --text-primary: #0F172A;
  --text-secondary: #64748B;
  --text-tertiary: #94A3B8;
  --text-rgb: 15, 23, 42;
  --primary: #2563EB;
  --primary-rgb: 37, 99, 235;
  --primary-soft: rgba(37, 99, 235, .10);
  --good: #10B981;
  --good-rgb: 16, 185, 129;
  --warn: #F59E0B;
  --warn-rgb: 245, 158, 11;
  --danger: #EF4444;
  --danger-rgb: 239, 68, 68;
  --accent-cyan: #06B6D4;
  --accent-violet: #8B5CF6;
  --metric-weight: #2563EB;
  --metric-bmi: #8B5CF6;
  --metric-bodyFat: #F97316;
  --metric-muscle: #06B6D4;
  --metric-water: #0EA5E9;
  --metric-visceral: #F43F5E;
  --metric-protein: #6366F1;
  --metric-bone: #14B8A6;
  --divider: #E2E8F0;
  --track: #E2E8F0;
  --track-soft: #F1F5F9;
  --handle: #CBD5E1;
  --scrim: #020617;
  --shadow-card: 0 1px 2px rgba(15, 23, 42, .035), 0 10px 24px -20px rgba(15, 23, 42, .28);
  --action-grad: linear-gradient(135deg, #2563EB 0%, #3B82F6 48%, #0891B2 118%);
}
.app[data-theme="dark"] {
  --bg: #0B0F19;
  --bg-rgb: 11, 15, 25;
  --sheet: #1E293B;
  --sheet-rgb: 30, 41, 59;
  --sheet-border: rgba(148, 163, 184, .14);
  --card: #0F172A;
  --card-selected: #17223A;
  --card-border: rgba(148, 163, 184, .10);
  --text-primary: #F8FAFC;
  --text-secondary: #94A3B8;
  --text-tertiary: #64748B;
  --text-rgb: 248, 250, 252;
  --primary: #60A5FA;
  --primary-rgb: 96, 165, 250;
  --primary-soft: rgba(96, 165, 250, .14);
  --good: #34D399;
  --good-rgb: 52, 211, 153;
  --warn: #FBBF24;
  --warn-rgb: 251, 191, 36;
  --danger: #F87171;
  --danger-rgb: 248, 113, 113;
  --accent-cyan: #22D3EE;
  --accent-violet: #A78BFA;
  --metric-weight: #60A5FA;
  --metric-bmi: #A78BFA;
  --metric-bodyFat: #FB923C;
  --metric-muscle: #22D3EE;
  --metric-water: #38BDF8;
  --metric-visceral: #FB7185;
  --metric-protein: #818CF8;
  --metric-bone: #2DD4BF;
  --divider: #334155;
}
.app[data-theme="dark"] .metric-card[data-metric="weight"] { --metric-accent-rgb: 96, 165, 250; }
.app[data-theme="dark"] .metric-card[data-metric="bmi"] { --metric-accent-rgb: 167, 139, 250; }
.app[data-theme="dark"] .metric-card[data-metric="bodyFat"] { --metric-accent-rgb: 251, 146, 60; }
.app[data-theme="dark"] .metric-card[data-metric="muscle"] { --metric-accent-rgb: 34, 211, 238; }
.app[data-theme="dark"] .metric-card[data-metric="water"] { --metric-accent-rgb: 56, 189, 248; }
.app[data-theme="dark"] .metric-card[data-metric="visceral"] { --metric-accent-rgb: 251, 113, 133; }
.app[data-theme="dark"] .metric-card[data-metric="protein"] { --metric-accent-rgb: 129, 140, 248; }
.app[data-theme="dark"] .metric-card[data-metric="bone"] { --metric-accent-rgb: 45, 212, 191; }
  --track: #334155;
  --track-soft: #172033;
  --handle: #475569;
  --scrim: #020617;
  --shadow-card: 0 1px 2px rgba(0, 0, 0, .18), 0 14px 30px -24px rgba(0, 0, 0, .9);
  --action-grad: linear-gradient(135deg, #1D4ED8 0%, #2563EB 50%, #0E7490 120%);
}

/* ---------- Z-0 背景微光 ---------- */
.bg {
  position: absolute;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  background: var(--bg);
  transition: background-color .35s ease;
}
.bg-orb {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
  filter: blur(24px);
  will-change: transform;
}
.orb-1 {
  width: 370px; height: 370px;
  left: -146px; top: -118px;
  background: radial-gradient(circle at 52% 52%, rgba(var(--primary-rgb), .50), transparent 68%);
  animation: driftA 19s ease-in-out infinite alternate;
}
.orb-2 {
  width: 330px; height: 330px;
  right: -158px; top: 96px;
  background: radial-gradient(circle at 50% 50%, rgba(6, 182, 212, .40), transparent 70%);
  animation: driftB 23s ease-in-out infinite alternate;
}
.orb-3 {
  width: 400px; height: 400px;
  left: -120px; bottom: -210px;
  background: radial-gradient(circle at 55% 45%, rgba(139, 92, 246, .34), transparent 70%);
  animation: driftC 26s ease-in-out infinite alternate;
}
.orb-4 {
  width: 286px; height: 286px;
  left: 50%; top: 88px;
  transform: translateX(-50%);
  background: radial-gradient(circle, rgba(var(--primary-rgb), .16), transparent 66%);
  filter: blur(14px);
}
.bg-grid {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(var(--text-rgb), .045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(var(--text-rgb), .045) 1px, transparent 1px);
  background-size: 44px 44px;
  -webkit-mask-image: radial-gradient(82% 66% at 50% 34%, #000 0%, transparent 78%);
  mask-image: radial-gradient(82% 66% at 50% 34%, #000 0%, transparent 78%);
  opacity: .55;
  transition: opacity .3s ease;
}
.bg-vignette {
  position: absolute;
  inset: 0;
  background: radial-gradient(120% 96% at 50% 24%, transparent 48%, rgba(var(--bg-rgb), .52) 100%);
}
@keyframes driftA {
  from { transform: translate3d(0, 0, 0) scale(1); }
  to { transform: translate3d(26px, 22px, 0) scale(1.06); }
}
@keyframes driftB {
  from { transform: translate3d(0, 0, 0) scale(1.04); }
  to { transform: translate3d(-30px, 18px, 0) scale(.96); }
}
@keyframes driftC {
  from { transform: translate3d(0, 0, 0) scale(.98); }
  to { transform: translate3d(24px, -24px, 0) scale(1.05); }
}

/* ---------- Z-10 主舞台 ---------- */
.stage {
  position: absolute;
  inset: 0;
  z-index: 10;
  display: flex;
  flex-direction: column;
  padding: 0 20px;
  transform-origin: 50% 32%;
  will-change: transform;
}
.stage-header {
  flex: none;
  height: 36px;
  margin-top: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  transition: opacity .25s ease;
}
.brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
.brand-mark {
  width: 30px; height: 30px;
  flex: none;
  border-radius: 10px;
  display: grid;
  place-items: center;
  color: #fff;
  background: linear-gradient(145deg, var(--primary), var(--accent-cyan));
  box-shadow: 0 7px 18px -8px rgba(var(--primary-rgb), .8);
}
.brand-mark svg { width: 17px; height: 17px; display: block; }
.brand-copy { min-width: 0; }
.brand-title {
  display: block;
  font-size: 14px;
  font-weight: 650;
  line-height: 1.05;
  letter-spacing: .01em;
}
.brand-sub {
  display: block;
  margin-top: 3px;
  font-size: 9px;
  line-height: 1;
  letter-spacing: .06em;
  color: var(--text-tertiary);
}
.date-pill {
  flex: none;
  height: 26px;
  padding: 0 10px;
  border-radius: 13px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(var(--sheet-rgb), .50);
  border: 1px solid rgba(var(--text-rgb), .06);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  font-size: 9.5px;
  font-weight: 550;
  color: var(--text-secondary);
  letter-spacing: .01em;
  font-variant-numeric: tabular-nums;
}
.date-pill i {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--good);
  box-shadow: 0 0 0 3px rgba(var(--good-rgb), .12);
}
.hero {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: 22px;
}
.status-capsule {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 28px;
  padding: 0 11px 0 12px;
  border-radius: 14px;
  background: rgba(var(--sheet-rgb), .56);
  border: 1px solid rgba(var(--text-rgb), .07);
  box-shadow: 0 6px 18px -14px rgba(15, 23, 42, .5);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  color: var(--text-secondary);
  font-size: 10.5px;
  font-weight: 550;
  letter-spacing: .01em;
  transition: background-color .25s ease, border-color .25s ease, transform .18s ease;
}
.status-capsule:hover { background: rgba(var(--sheet-rgb), .76); }
.status-capsule:active { transform: scale(.985); }
.status-dot {
  width: 6px; height: 6px;
  flex: none;
  border-radius: 50%;
  background: var(--good);
  box-shadow: 0 0 0 3px rgba(var(--good-rgb), .13);
  animation: breathe 2.8s ease-in-out infinite;
}
.status-dot[data-tone="blue"] { background: var(--primary); box-shadow: 0 0 0 3px rgba(var(--primary-rgb), .16); }
.status-dot[data-tone="amber"] { background: var(--warn); box-shadow: 0 0 0 3px rgba(var(--warn-rgb), .16); animation-duration: 1.15s; }
.status-dot[data-tone="slate"] { background: var(--text-tertiary); box-shadow: 0 0 0 3px rgba(var(--text-rgb), .08); animation: none; }
.status-text {
  max-width: 238px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.capsule-chevron { width: 9px; height: 9px; opacity: .45; flex: none; }
@keyframes breathe {
  0%, 100% { opacity: 1; }
  50% { opacity: .45; }
}

/* 表盘：240 / 4pt 环 / 64pt 数字 */
.dial-wrap {
  position: relative;
  width: 240px;
  height: 240px;
  flex: none;
  margin-top: 22px;
}
.ambient-ring {
  position: absolute;
  left: 50%; top: 50%;
  border-radius: 50%;
  border: 1px dashed rgba(var(--text-rgb), .13);
  pointer-events: none;
  transform: translate(-50%, -50%);
}
.ring-a { width: 296px; height: 296px; animation: spin 70s linear infinite; }
.ring-b { width: 330px; height: 330px; opacity: .5; animation: spin 110s linear infinite reverse; }
@keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
.dial {
  position: relative;
  width: 240px;
  height: 240px;
  border-radius: 50%;
}
.dial::before {
  content: "";
  position: absolute;
  inset: 12px;
  border-radius: 50%;
  background: radial-gradient(circle at 50% 38%, rgba(var(--sheet-rgb), .58), transparent 70%);
  pointer-events: none;
}
.dial-halo {
  position: absolute;
  inset: -27px;
  border-radius: 50%;
  background: radial-gradient(circle,
    rgba(var(--primary-rgb), .17) 0%,
    rgba(6, 182, 212, .07) 42%,
    transparent 68%);
  filter: blur(7px);
  pointer-events: none;
}
.dial-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
}
.ring-track {
  fill: none;
  stroke: var(--track);
  stroke-width: 4;
  opacity: .62;
}
.ring-progress {
  fill: none;
  stroke: url(#ringGradient);
  stroke-width: 4;
  stroke-linecap: round;
  filter: drop-shadow(0 0 5px rgba(var(--primary-rgb), .32));
  transition: stroke-dashoffset .9s cubic-bezier(.22, 1, .36, 1);
}
.ring-inner {
  fill: url(#innerGlow);
  stroke: rgba(var(--text-rgb), .055);
  stroke-width: 1;
}
.stop-primary { stop-color: var(--primary); }
.stop-cyan { stop-color: var(--accent-cyan); }
.stop-violet { stop-color: var(--accent-violet); }
.inner-a { stop-color: var(--primary); stop-opacity: .11; }
.inner-b { stop-color: var(--primary); stop-opacity: .025; }
.inner-c { stop-color: var(--primary); stop-opacity: 0; }
.dial-ticks line {
  stroke: var(--text-tertiary);
  stroke-width: 1;
  opacity: .30;
}
.dial-ticks line.major { opacity: .52; stroke-width: 1.2; }
.dial-flow {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  pointer-events: none;
  opacity: 0;
  background: conic-gradient(from -90deg,
    transparent 0%,
    transparent 54%,
    rgba(var(--primary-rgb), .06) 66%,
    var(--primary) 86%,
    rgba(255, 255, 255, .92) 94%,
    transparent 100%);
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 5px));
  mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 5px));
  filter: drop-shadow(0 0 7px rgba(var(--primary-rgb), .65));
}
.dial.is-scanning .dial-flow { animation: ringSweep 1s cubic-bezier(.4, 0, .2, 1) both; }
@keyframes ringSweep {
  0% { opacity: 0; transform: rotate(-90deg); }
  14% { opacity: 1; }
  82% { opacity: 1; }
  100% { opacity: 0; transform: rotate(270deg); }
}
.dial.is-locked .weight-line { animation: numberFlicker .6s ease-in-out both; }
@keyframes numberFlicker {
  0%, 100% { opacity: 1; }
  25% { opacity: .12; }
  50% { opacity: 1; }
  75% { opacity: .12; }
}
.dial-content {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding-top: 1px;
  pointer-events: none;
}
.dial-label {
  font-size: 9.5px;
  font-weight: 500;
  letter-spacing: .18em;
  color: var(--text-tertiary);
}
.weight-line {
  display: flex;
  align-items: baseline;
  gap: 5px;
  margin-top: 5px;
  line-height: 1;
}
.weight-value {
  font-size: 64px;
  font-weight: 600;
  letter-spacing: -.045em;
  color: var(--text-primary);
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1, "lnum" 1;
  text-shadow: 0 3px 26px rgba(var(--primary-rgb), .12);
}
.weight-unit {
  font-size: 18px;
  font-weight: 500;
  letter-spacing: -.01em;
  color: var(--text-secondary);
}
.weight-delta {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 20px;
  margin-top: 8px;
  padding: 0 8px;
  border-radius: 10px;
  background: rgba(var(--good-rgb), .09);
  color: var(--good);
  font-size: 10px;
  font-weight: 550;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  transition: background-color .25s ease, color .25s ease;
}
.weight-delta.up { background: rgba(var(--warn-rgb), .11); color: var(--warn); }
.weight-delta.flat { background: rgba(var(--text-rgb), .05); color: var(--text-secondary); }
.dial-caption {
  margin: 14px 0 0;
  min-height: 16px;
  font-size: 10.5px;
  line-height: 16px;
  color: var(--text-secondary);
  text-align: center;
  letter-spacing: .01em;
}
.primary-action {
  position: relative;
  margin-top: 18px;
  height: 48px;
  min-width: 216px;
  padding: 0 26px;
  border-radius: 24px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: var(--action-grad);
  color: #fff;
  font-size: 14px;
  font-weight: 650;
  letter-spacing: .015em;
  box-shadow:
    0 14px 28px -14px rgba(var(--primary-rgb), .85),
    0 2px 8px -2px rgba(15, 23, 42, .18),
    inset 0 1px 0 rgba(255, 255, 255, .26);
  transition: transform .18s ease, box-shadow .25s ease, opacity .2s ease;
}
.primary-action:hover { box-shadow: 0 18px 34px -14px rgba(var(--primary-rgb), .9), inset 0 1px 0 rgba(255,255,255,.3); }
.app[data-sheet="half"] .primary-action,
.app[data-sheet="full"] .primary-action,
.app[data-sheet="half"] .stage-insight,
.app[data-sheet="full"] .stage-insight {
  opacity: 0;
  pointer-events: none;
}
.primary-action:active { transform: scale(.97); }
.primary-action:disabled { opacity: .62; box-shadow: 0 8px 20px -18px rgba(var(--primary-rgb), .7); }
.action-icon svg { width: 16px; height: 16px; display: block; }
.action-spinner {
  display: none;
  width: 14px; height: 14px;
  border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, .32);
  border-top-color: #fff;
  animation: spinSimple .85s linear infinite;
}
.app[data-phase="calculating"] .action-spinner { display: block; }
.app[data-phase="calculating"] .action-icon { display: none; }
@keyframes spinSimple { to { transform: rotate(360deg); } }
.stage-insight {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-top: 15px;
  min-height: 14px;
  font-size: 9.5px;
  color: var(--text-tertiary);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  transition: opacity .2s ease;
}
.stage-insight b { color: var(--text-secondary); font-weight: 650; }
.insight-sep { width: 1px; height: 8px; background: var(--divider); }
.stage-footer {
  position: absolute;
  left: 20px;
  right: 20px;
  bottom: calc(12% + 14px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  transition: opacity .25s ease;
}
.member-pill {
  height: 34px;
  padding: 0 10px 0 6px;
  border-radius: 17px;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  background: rgba(var(--sheet-rgb), .58);
  border: 1px solid rgba(var(--text-rgb), .065);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  color: var(--text-secondary);
  font-size: 10.5px;
  font-weight: 550;
  box-shadow: 0 8px 20px -18px rgba(15, 23, 42, .5);
}
.member-pill:hover { background: rgba(var(--sheet-rgb), .78); }
.mini-avatar {
  width: 22px; height: 22px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  flex: none;
  color: #fff;
  font-size: 9px;
  font-weight: 700;
  background: var(--avatar, #8B5CF6);
}
.member-pill svg { width: 9px; height: 9px; opacity: .45; }
.ghost-link {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 30px;
  padding: 0 9px;
  border-radius: 12px;
  color: var(--text-secondary);
  font-size: 10px;
  font-weight: 550;
}
.ghost-link:hover { background: rgba(var(--text-rgb), .045); }
.ghost-link svg { width: 11px; height: 11px; opacity: .5; }
.app[data-sheet="full"] .stage-header,
.app[data-sheet="full"] .stage-footer { opacity: 0; pointer-events: none; }

/* ---------- Z-20 遮罩 ---------- */
.scrim {
  position: absolute;
  inset: 0;
  z-index: 20;
  background: var(--scrim);
  opacity: 0;
  pointer-events: none;
  transition: opacity .22s ease;
}

/* ---------- Z-30 抽屉：固定 92% 高 + 位移 ---------- */
.sheet {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 30;
  height: 92%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-radius: 28px 28px 0 0;
  background: rgba(var(--sheet-rgb), .94);
  border-top: 1px solid var(--sheet-border);
  box-shadow:
    0 -24px 70px -30px rgba(2, 6, 23, .48),
    0 -1px 0 rgba(255, 255, 255, .35) inset;
  -webkit-backdrop-filter: blur(30px) saturate(160%);
  backdrop-filter: blur(30px) saturate(160%);
  transform: translate3d(0, 87%, 0);
  will-change: transform;
  transition: background-color .3s ease, border-color .3s ease;
}
.sheet-head {
  position: relative;
  flex: none;
  padding: 0 16px;
  cursor: grab;
  user-select: none;
  -webkit-user-select: none;
}
.grabber,
.sheet-title-row { touch-action: none; }
.sheet-controls { touch-action: pan-x; }
.trend-chart text {
  font-family: inherit;
  font-variant-numeric: tabular-nums;
}
.sheet-head.is-dragging { cursor: grabbing; }
.sheet-head::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 28px 28px 0 0;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(var(--sheet-rgb), .62), transparent 78%);
}
.grabber {
  position: relative;
  height: 4px;
  margin-top: 8px;
  display: flex;
  justify-content: center;
}
.grabber span {
  display: block;
  width: 36px;
  height: 4px;
  border-radius: 2px;
  background: var(--handle);
}
.sheet-title-row {
  position: relative;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-top: 10px;
}
.sheet-title { min-width: 0; }
.sheet-title-line { display: flex; align-items: center; gap: 8px; }
.sheet-title h2 {
  margin: 0;
  font-size: 17px;
  font-weight: 650;
  line-height: 21px;
  letter-spacing: -.012em;
  color: var(--text-primary);
}
.sheet-badge {
  height: 17px;
  padding: 0 7px;
  border-radius: 9px;
  display: inline-flex;
  align-items: center;
  font-size: 8.5px;
  font-weight: 650;
  letter-spacing: .02em;
  color: var(--primary);
  background: var(--primary-soft);
  white-space: nowrap;
}
.sheet-badge.is-warn { color: var(--warn); background: rgba(var(--warn-rgb), .11); }
.sheet-badge.is-muted { color: var(--text-secondary); background: rgba(var(--text-rgb), .055); }
.sheet-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 3px 0 0;
  font-size: 10px;
  line-height: 13px;
  color: var(--text-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-variant-numeric: tabular-nums;
}
.sheet-meta .meta-sep { opacity: .45; }
.icon-button {
  flex: none;
  width: 30px; height: 30px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  color: var(--text-secondary);
  background: var(--track-soft);
  border: 1px solid rgba(var(--text-rgb), .045);
  transition: background-color .2s ease, transform .2s ease;
}
.icon-button:hover { background: rgba(var(--text-rgb), .07); }
.icon-button svg { width: 14px; height: 14px; transition: transform .32s cubic-bezier(.22, 1, .36, 1); }
.sheet.is-full .sheet-toggle svg { transform: rotate(180deg); }
.sheet-controls {
  position: relative;
  padding-top: 11px;
  padding-bottom: 9px;
  transition: opacity .18s ease;
}
.sheet.is-collapsed .sheet-controls { opacity: 0; }
.control-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.segmented {
  position: relative;
  display: inline-flex;
  height: 30px;
  padding: 3px;
  border-radius: 10px;
  background: var(--track-soft);
  border: 1px solid rgba(var(--text-rgb), .045);
}
.seg-btn {
  position: relative;
  z-index: 1;
  width: 52px;
  height: 24px;
  border-radius: 8px;
  font-size: 10.5px;
  font-weight: 550;
  color: var(--text-secondary);
  transition: color .2s ease;
}
.seg-btn.active { color: var(--text-primary); font-weight: 650; }
.seg-thumb {
  position: absolute;
  top: 3px;
  left: 3px;
  width: 52px;
  height: 24px;
  border-radius: 8px;
  background: rgba(var(--sheet-rgb), .98);
  box-shadow:
    0 2px 8px -3px rgba(15, 23, 42, .22),
    0 0 0 1px rgba(var(--text-rgb), .035);
  transform: translateX(calc(var(--seg-index, 0) * 52px));
  transition: transform .34s cubic-bezier(.22, 1, .36, 1);
}
.record-count {
  font-size: 9px;
  color: var(--text-tertiary);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.date-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-top: 8px;
}
.date-arrow {
  width: 28px;
  height: 28px;
  flex: none;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--divider);
  color: var(--text-primary);
  background: var(--card);
}
.date-arrow:disabled {
  opacity: .35;
}
.date-current {
  min-width: 0;
  flex: 1;
  text-align: center;
  font-size: 11px;
  font-weight: 650;
  color: var(--text-primary);
  font-variant-numeric: tabular-nums;
}
.timeline {
  position: relative;
  display: flex;
  gap: 8px;
  height: 44px;
  margin-top: 8px;
  padding: 0 2px;
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: none;
  -ms-overflow-style: none;
  scroll-snap-type: x proximity;
  touch-action: pan-x;
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 7px, #000 calc(100% - 12px), transparent 100%);
  mask-image: linear-gradient(90deg, transparent 0, #000 7px, #000 calc(100% - 12px), transparent 100%);
}
.timeline::-webkit-scrollbar { display: none; }
.tl-chip {
  flex: none;
  height: 44px;
  min-width: 56px;
  padding: 5px 9px;
  border-radius: 12px;
  border: 1px solid transparent;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  gap: 1px;
  text-align: left;
  scroll-snap-align: start;
  transition: background-color .2s ease, border-color .2s ease;
}
.tl-chip:hover { background: rgba(var(--text-rgb), .035); }
.tl-chip.active {
  background: var(--primary-soft);
  border-color: rgba(var(--primary-rgb), .34);
}
.tl-date {
  font-size: 10.5px;
  font-weight: 650;
  line-height: 13px;
  color: var(--text-secondary);
  font-variant-numeric: tabular-nums;
  letter-spacing: .01em;
}
.tl-chip.active .tl-date { color: var(--primary); }
.tl-sub {
  font-size: 8.5px;
  line-height: 11px;
  color: var(--text-tertiary);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.tl-chip.active .tl-sub { color: var(--primary); opacity: .78; }
.member-filter {
  display: flex;
  gap: 6px;
  margin-top: 7px;
  padding-bottom: 1px;
  overflow-x: auto;
  scrollbar-width: none;
  touch-action: pan-x;
}
.member-filter::-webkit-scrollbar { display: none; }
.member-chip {
  flex: none;
  height: 24px;
  padding: 0 8px 0 4px;
  border-radius: 12px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border: 1px solid var(--divider);
  color: var(--text-secondary);
  font-size: 9.5px;
  font-weight: 500;
  white-space: nowrap;
  transition: background-color .2s ease, border-color .2s ease, color .2s ease;
}
.member-chip:hover { background: rgba(var(--text-rgb), .035); }
.member-chip.active {
  color: var(--primary);
  border-color: rgba(var(--primary-rgb), .42);
  background: var(--primary-soft);
}
.chip-avatar {
  width: 17px; height: 17px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  flex: none;
  color: #fff;
  font-size: 7.5px;
  font-weight: 700;
  background: var(--avatar, var(--primary));
}
.chip-avatar.all { background: var(--text-tertiary); }

/* 抽屉内容 */
.sheet-body {
  flex: 1;
  min-height: 0;
  overflow-x: hidden;
  overflow-y: auto;
  padding: 10px 0 max(24px, env(safe-area-inset-bottom));
  scrollbar-width: none;
  -ms-overflow-style: none;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  transition: padding-bottom .15s ease;
}
.sheet-body::-webkit-scrollbar { display: none; }

/* 180pt 趋势图 */
.trend-panel {
  margin: 2px 16px 14px;
  padding: 12px 12px 6px;
  border-radius: 16px;
  background: var(--card);
  border: 1px solid var(--card-border);
  box-shadow: var(--shadow-card);
  transition: background-color .3s ease, border-color .3s ease;
}
.trend-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 8px;
  height: 32px;
}
.trend-title {
  display: block;
  font-size: 12px;
  font-weight: 650;
  line-height: 15px;
  color: var(--text-primary);
}
.trend-sub {
  display: block;
  margin-top: 1px;
  font-size: 8.5px;
  line-height: 11px;
  color: var(--text-tertiary);
  font-variant-numeric: tabular-nums;
}
.trend-current { display: flex; align-items: baseline; gap: 2px; }
.trend-value {
  font-size: 20px;
  font-weight: 650;
  letter-spacing: -.025em;
  line-height: 1;
  color: var(--text-primary);
  font-variant-numeric: tabular-nums;
}
.trend-unit { font-size: 8.5px; color: var(--text-tertiary); }
.trend-delta {
  margin-left: 5px;
  padding: 1px 5px;
  border-radius: 6px;
  font-size: 8.5px;
  font-weight: 650;
  color: var(--good);
  background: rgba(var(--good-rgb), .10);
  font-variant-numeric: tabular-nums;
}
.trend-delta.up { color: var(--warn); background: rgba(var(--warn-rgb), .12); }
.trend-chart-wrap { position: relative; height: 180px; margin-top: 2px; }
.trend-chart {
  display: block;
  width: 100%;
  height: 180px;
  overflow: visible;
  cursor: crosshair;
}
.chart-single-note {
  position: absolute;
  left: 50%;
  bottom: 30px;
  transform: translateX(-50%);
  max-width: calc(100% - 20px);
  height: 24px;
  padding: 0 10px;
  border-radius: 12px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(var(--sheet-rgb), .86);
  border: 1px solid var(--divider);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  color: var(--text-secondary);
  font-size: 9px;
  white-space: nowrap;
}
.chart-pulse { animation: chartPulse 2.6s ease-in-out infinite; }
@keyframes chartPulse {
  0%, 100% { opacity: .10; }
  50% { opacity: .26; }
}

.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin: 0 16px 8px;
}
.section-title { font-size: 11px; font-weight: 650; color: var(--text-secondary); letter-spacing: .01em; }
.section-hint { font-size: 8.5px; color: var(--text-tertiary); }

/* 8 项 Bento */
.metric-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  margin: 0 16px;
  align-items: stretch;
}
.bia-tip {
  grid-column: 1 / -1;
  height: 36px;
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 0 10px;
  border-radius: 10px;
  background: rgba(var(--warn-rgb), .10);
  border: 1px solid rgba(var(--warn-rgb), .18);
  color: var(--warn);
  font-size: 9.5px;
  line-height: 1.3;
}
.bia-tip svg { width: 13px; height: 13px; flex: none; }
.metric-card {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  min-width: 0;
  padding: 12px;
  border-radius: 24px;
  border: 1px solid var(--card-border);
  background: var(--card);
  color: var(--text-primary);
  text-align: left;
  overflow: hidden;
  box-shadow: var(--shadow-card);
  opacity: 0;
  transform: translateY(12px);
  transition:
    opacity .38s cubic-bezier(.22, 1, .36, 1),
    transform .38s cubic-bezier(.22, 1, .36, 1),
    background-color .25s ease,
    border-color .25s ease,
    box-shadow .25s ease;
}
.metric-grid.is-revealed .metric-card { opacity: 1; transform: translateY(0); }
.metric-grid.instant .metric-card { opacity: 1; transform: none; transition: none; }
/* 参考健康卡片：更高、更宽松的圆角卡片 */
.metric-card.h76 { height: 88px; padding: 10px 12px; }
.metric-card[data-metric="weight"] { --metric-accent: var(--metric-weight); --metric-accent-rgb: 37, 99, 235; }
.metric-card[data-metric="bmi"] { --metric-accent: var(--metric-bmi); --metric-accent-rgb: 139, 92, 246; }
.metric-card[data-metric="bodyFat"] { --metric-accent: var(--metric-bodyFat); --metric-accent-rgb: 249, 115, 22; }
.metric-card[data-metric="muscle"] { --metric-accent: var(--metric-muscle); --metric-accent-rgb: 6, 182, 212; }
.metric-card[data-metric="water"] { --metric-accent: var(--metric-water); --metric-accent-rgb: 14, 165, 233; }
.metric-card[data-metric="visceral"] { --metric-accent: var(--metric-visceral); --metric-accent-rgb: 244, 63, 94; }
.metric-card[data-metric="protein"] { --metric-accent: var(--metric-protein); --metric-accent-rgb: 99, 102, 241; }
.metric-card[data-metric="bone"] { --metric-accent: var(--metric-bone); --metric-accent-rgb: 20, 184, 166; }
.metric-card.h96 { height: 112px; padding: 12px; }
.metric-card.h84 { height: 96px; padding: 12px; }
.metric-card.h68 { height: 80px; padding: 10px 12px; }
.h84 .card-foot { display: none; }
.metric-card::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: .38;
  background:
    radial-gradient(120% 80% at 100% 0%, rgba(var(--metric-accent-rgb), .10), transparent 62%),
    linear-gradient(145deg, rgba(var(--metric-accent-rgb), .06), transparent 52%);
  transition: opacity .25s ease;
}
@media (hover: hover) {
  .metric-grid.is-revealed .metric-card:hover {
    transform: translateY(-1px);
    box-shadow: 0 3px 6px rgba(15, 23, 42, .04), 0 14px 28px -20px rgba(15, 23, 42, .38);
  }
  .metric-card:hover::before { opacity: 1; }
}
.metric-grid.is-revealed .metric-card:active { transform: scale(.985); }
.metric-card[aria-pressed="true"] {
  border-color: var(--metric-accent, var(--primary));
  background: var(--card-selected);
  box-shadow:
    0 0 0 1.5px var(--metric-accent, var(--primary)),
    0 12px 26px -20px rgba(var(--metric-accent-rgb, var(--primary-rgb)), .65);
}
.metric-card[aria-pressed="true"]::before { opacity: 1; }
.metric-card.is-baseline .card-foot { color: var(--primary); font-weight: 600; }
.card-head {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 32px;
}
.card-head::before {
  content: attr(data-icon);
  width: 36px;
  height: 36px;
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  color: #fff;
  font-size: 13px;
  font-weight: 750;
  line-height: 1;
  background: var(--metric-accent, var(--primary));
  box-shadow: 0 5px 12px -7px rgba(var(--metric-accent-rgb, var(--primary-rgb)), .8);
}
.card-title {
  min-width: 0;
  flex: 1;
  font-size: 11px;
  font-weight: 650;
  line-height: 14px;
  letter-spacing: .01em;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.card-value {
  display: flex;
  align-items: baseline;
  gap: 2px;
  margin-top: 3px;
  line-height: 1;
}
.num {
  font-size: 26px;
  font-weight: 650;
  letter-spacing: -.035em;
  color: var(--metric-accent, var(--text-primary));
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1, "lnum" 1;
}
.unit {
  font-size: 8.5px;
  font-weight: 500;
  letter-spacing: .01em;
  color: var(--text-tertiary);
  white-space: nowrap;
}
.h96 .num { font-size: 30px; }
.h84 .num { font-size: 27px; }
.h68 .num { font-size: 21px; letter-spacing: -.03em; }
.h76 .num { font-size: 26px; }
.h96 .unit, .h84 .unit { font-size: 9px; }
.h68 .unit { font-size: 8px; }
.metric-card.no-data .num { color: var(--text-tertiary); font-weight: 500; letter-spacing: 0; }
.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 16px;
  padding: 0 6px;
  border-radius: 8px;
  font-size: 8.5px;
  font-weight: 650;
  line-height: 1;
  white-space: nowrap;
  color: var(--text-secondary);
  background: rgba(var(--text-rgb), .055);
}
.status-pill i { width: 4px; height: 4px; border-radius: 50%; background: currentColor; flex: none; }
.status-pill.good { color: var(--good); background: rgba(var(--good-rgb), .10); }
.status-pill.warn { color: var(--warn); background: rgba(var(--warn-rgb), .12); }
.status-pill.danger { color: var(--danger); background: rgba(var(--danger-rgb), .11); }
.status-pill.neutral { color: var(--text-tertiary); background: rgba(var(--text-rgb), .05); }
.delta-pill, .status-pill, .baseline-tag {
  margin-left: auto;
}
.delta-pill {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  height: 18px;
  padding: 0 6px;
  border-radius: 9px;
  font-size: 8.5px;
  font-weight: 650;
  line-height: 1;
  color: var(--good);
  background: rgba(var(--good-rgb), .10);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.delta-pill.up { color: var(--warn); background: rgba(var(--warn-rgb), .12); }
.delta-pill.flat { color: var(--text-secondary); background: rgba(var(--text-rgb), .05); }
.delta-pill svg { width: 8px; height: 8px; transition: transform .25s ease; }
.delta-pill.up svg { transform: rotate(180deg); }
.baseline-tag {
  display: inline-flex;
  align-items: center;
  height: 18px;
  padding: 0 6px;
  border-radius: 9px;
  color: var(--primary);
  background: var(--primary-soft);
  font-size: 8.5px;
  font-weight: 650;
  white-space: nowrap;
}
.range {
  position: relative;
  display: flex;
  align-items: center;
  height: 10px;
  margin-top: auto;
  flex: none;
}
.range-track {
  position: relative;
  display: flex;
  width: 100%;
  height: 4px;
  border-radius: 2px;
  overflow: hidden;
  background: var(--track);
  transition: opacity .25s ease;
}
.h68 .range-track { height: 3px; }
.seg { display: block; height: 100%; width: 0; transition: width .45s cubic-bezier(.22, 1, .36, 1); }
.seg.low { background: rgba(var(--warn-rgb), .34); }
.seg.ok { background: rgba(var(--good-rgb), .72); }
.seg.high { background: rgba(var(--danger-rgb), .32); }
.range-pin {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 8px;
  height: 8px;
  margin: -4px 0 0 -4px;
  border-radius: 50%;
  background: var(--card);
  border: 2px solid var(--metric-accent, var(--primary));
  box-shadow:
    0 0 0 2px rgba(var(--primary-rgb), .10),

<script>
(function () {
  'use strict';

  var $ = function (sel, root) { return (root || document).querySelector(sel); };
  var $$ = function (sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };
  var clamp = function (v, a, b) { return Math.min(b, Math.max(a, v)); };
  var pad2 = function (n) { return (n < 10 ? '0' : '') + n; };

  var DAY = 86400000;
  var MEMBERS = [
    { id: 'm1', name: '林小满', short: '满', sex: 'female', sexLabel: '女', age: 28, heightCm: 164, color: '#8B5CF6' },

  /* 14 条历史，按“最近在前”排列；用于单次/周均/月均聚合 */
  var SERIES = {
    m1: {

  var DAY_OFFSETS = [0.03, 2, 5, 9, 14, 20, 27, 34, 42, 50, 58, 66, 74, 82];
  var METRIC_KEYS = ['weight', 'bmi', 'bodyFat', 'muscle', 'water', 'visceral', 'protein', 'bone'];
  var METRICS = {
    weight:   { title: '体重',     unit: 'kg',     decimals: 1 },
    bmi:      { title: 'BMI',      unit: 'kg/m²',  decimals: 1 },
    bodyFat:  { title: '体脂率',   unit: '%',      decimals: 1 },
    muscle:   { title: '肌肉量',   unit: 'kg',     decimals: 1 },
    water:    { title: '水分率',   unit: '%',      decimals: 1 },
    visceral: { title: '内脏脂肪', unit: '级',     decimals: 0 },
    protein:  { title: '蛋白质',   unit: '%',      decimals: 1 },
    bone:     { title: '骨量',     unit: 'kg',     decimals: 1 }
  };
  var MODE_LABEL = { single: '按次', week: '周均', month: '月均' };
  var ANCHOR = { full: 0, half: 0.30, collapsed: 0.80 };
  var RING_C = 2 * Math.PI * 116;
